/**
 * When the last report went out, and what it said. A report that repeats the
 * last one tells the Lawn nothing and still costs it, so a Mower that stands
 * still says so slowly. See "What a report costs" in CONTEXT.md.
 */
let sendAt = 0, sentX = null, sentY = null, sentA = null;
const bumps = [];
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const lastContact = new Map();
/** When your own daze ends, on the clock of `performance.now()`. */
let stunUntil = 0;
/** When you may be dazed again. A daze always buys its own `STUN_GRACE_MS`. */
let stunReadyAt = 0;

/**
 * Two Mowers meet at `closing` Tiles a second. Both are dazed, because a bump
 * is one event and the Mower that was standing still felt it too. Both
 * clients measure the same closing speed, so both reach the same answer, and
 * each one dazes itself and says so. A Mower therefore never dazes another
 * Mower: it only reports its own daze, the same as it reports its own
 * position and its own score. That also means a rewritten client cannot hold
 * anybody but itself: the grace that follows a daze is kept by the Mower that
 * was dazed.
 *
 * A contact below `BUMP_SPEED` is nothing at all: two Mowers parked against
 * each other touch every frame. A contact below `STUN_SPEED` throws dust and
 * leaves the controls alone.
 */
function bump(id, x, y, now, closing) {
  const previous = lastContact.get(id) ?? -Infinity;
  lastContact.set(id, now);
  if (now - previous < 350 || closing < BUMP_SPEED) return;
  bumps.push({ x, y, born: now });
  if (bumps.length > 12) bumps.shift();
  if (closing < STUN_SPEED || now < stunReadyAt) return;
  stunUntil = now + STUN_MS;
  stunReadyAt = stunUntil + STUN_GRACE_MS;
  if (connected) send({ t: "bump" });
}

/** Water this Mower cannot drive into. The bank is as far as it gets. */
function wet(x, y) {
  return wetAt(x, y, W, H) > -COLLISION_RADIUS;
}

/**
 * Take one step, and keep out of the Ditches. A step that ends in the water
 * is tried again along each axis on its own, so a Mower that meets a bank at
 * an angle slides along it instead of stopping dead. A Mower that is somehow
 * already in the water is not held there: it may always move.
 */
function stepAshore(x, y, dx, dy) {
  if (!wet(x + dx, y + dy) || wet(x, y)) return [x + dx, y + dy];
  if (dx !== 0 && !wet(x + dx, y)) return [x + dx, y];
  if (dy !== 0 && !wet(x, y + dy)) return [x, y + dy];
  return [x, y];
}

function moveMower(dx, dy, now) {
  const radius = COLLISION_RADIUS;
  const gap = radius * 2;
  const mvx = Math.cos(me.a) * me.v, mvy = Math.sin(me.a) * me.v;
  // Small steps keep a fast mower from crossing another between frames.
  const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (radius * 0.5)));
  for (let step = 0; step < steps; step++) {
    [me.x, me.y] = stepAshore(me.x, me.y, dx / steps, dy / steps);
    for (let pass = 0; pass < 4; pass++) {
      for (const [id, p] of peers) {
        if (now - p.seen > PEER_TIMEOUT) continue;
        const ox = me.x - p.x, oy = me.y - p.y;
        const distance = Math.hypot(ox, oy);
        if (distance >= gap) continue;
        // Opposite fallback directions also separate simultaneous spawns.
        const nx = distance > 0.001 ? ox / distance : (myId < id ? -1 : 1);
        const ny = distance > 0.001 ? oy / distance : 0;
        // How fast the two really close on each other, along the line
        // between them. Two Mowers driving side by side touch at nothing.
        const closing = ((p.vx ?? 0) - mvx) * nx + ((p.vy ?? 0) - mvy) * ny;
        bump(id, p.x + nx * radius, p.y + ny * radius, now, closing);
        // A shove is a step like any other: it stops at the bank as well.
        [me.x, me.y] = stepAshore(me.x, me.y, nx * (gap - distance), ny * (gap - distance));
      }
      me.x = Math.max(radius, Math.min(W - radius, me.x));
      me.y = Math.max(radius, Math.min(H - radius, me.y));
    }
  }
}

function drive(dt) {
  mowing *= Math.exp(-dt * 7);
  const now = performance.now();
  // A dazed Mower keeps its momentum and loses its controls. It is still
  // pushed by the Mower that hit it, and the blades are still down.
  const stunned = now < stunUntil;
  let fwd = (held("w", "arrowup") ? 1 : 0) - (held("s", "arrowdown") ? 1 : 0);
  // Left and right choose an Emote while the picker is open, so the wheels of
  // the Mower stay straight. Forward and back still drive.
  let turn = pickerOpen ? 0 : (held("d", "arrowright") ? 1 : 0) - (held("a", "arrowleft") ? 1 : 0);
  if (stick.mag > 0) {
    // Screen right is +x and screen down is +y in Tile units, because the
    // camera looks along +z from behind the Mower. The stick needs no basis.
    const want = Math.atan2(stick.dy, stick.dx) - me.a;
    const off = Math.atan2(Math.sin(want), Math.cos(want));
    // Ease off in a hard turn, but never to nothing: a Mower that has stopped
    // barely steers, so a full turn about would never come round.
    fwd = stick.mag * (0.45 + 0.55 * Math.max(0, Math.cos(off)));
    turn = Math.max(-1, Math.min(1, off * 2.2));
  }

  if (stunned) { fwd = 0; turn = 0; }
  me.v += fwd * ACCEL * dt;
  me.v -= me.v * DRAG * (stunned ? STUN_DRAG : 1) * dt;
  me.v = Math.max(-MAX_V * 0.5, Math.min(MAX_V, me.v));
  // A mower only steers while the wheels turn, same as the real thing.
  me.a += turn * TURN * dt * Math.min(1, 0.25 + Math.abs(me.v) / 4) * Math.sign(me.v || 1);
  // The daze reads on the Mower itself, and not only in the Stars above it.
  if (stunned && !reducedMotion.matches) me.a += Math.sin(now * 0.021) * 1.3 * dt;

  const px = me.x, py = me.y;
  moveMower(Math.cos(me.a) * me.v * dt, Math.sin(me.a) * me.v * dt, now);

  if (px !== me.x || py !== me.y) cut(px, py, me.x, me.y, me.a, true);

  if (now - positionSavedAt > 500) { savePosition(); positionSavedAt = now; }
  // One report says where the Mower is and which way it points. The Lawn cuts
  // from where it last saw this Mower to there and shows it to the others
  // from the same message, so a Mower cannot name a start it never drove
  // from, and a Mower the Lawn has lost cuts nothing until the Lawn has seen
  // it again. The swath the Lawn cuts is a straight one between two reports,
  // which at this rate is a tenth of the width of the Mower: the grass comes
  // off where the Mower drove. Your own Lawn is cut every frame regardless,
  // so nothing about the driving reads slower.
  if (connected && now - sendAt > SEND_MS) {
    const news = me.x !== sentX || me.y !== sentY || me.a !== sentA;
    if (news || now - sendAt > STILL_SEND_MS) {
      send({ t: "mow", x: me.x, y: me.y, a: me.a });
      sentX = me.x; sentY = me.y; sentA = me.a; sendAt = now;
    }
  }
  const renderTime = Date.now() + clockOffset - INTERP_DELAY;
  for (const [id, p] of peers) {
    if (now - p.seen > PEER_TIMEOUT) { peers.delete(id); lastContact.delete(id); continue; }
    interpolatePeer(p, renderTime);
  }
  // The heading and the board now count the same Mowers: the ones that have
  // spoken, and you.
  mowerCount = peers.size + 1;
  showMowerCount(mowerCount);
}

/** Blend headings as vectors, so they take the short way round at ±pi. */
function blendAngle(a0, a1, k) {
  return Math.atan2(Math.sin(a0) + (Math.sin(a1) - Math.sin(a0)) * k,
                    Math.cos(a0) + (Math.cos(a1) - Math.cos(a0)) * k);
}

/**
 * Put a Mower where it was at renderTime, between the two reports that
 * bracket that moment. When the reports run out the Mower holds at the last
 * real one rather than guessing past it.
 */
function interpolatePeer(p, renderTime) {
  const buf = p.buf;
  // Drop reports the render time has already passed, but keep the pair.
  while (buf.length > 2 && buf[1].t <= renderTime) buf.shift();
  const from = buf[0];
  if (!from) return;
  const to = buf[1];
  // A Mower that is held at a report is a Mower with no report to drive to,
  // so it counts as standing still: a bump needs to know which way the Mower
  // that arrived was driving, and a report says where it was, not how fast.
  if (!to || renderTime <= from.t) { p.x = from.x; p.y = from.y; p.a = from.a; p.vx = p.vy = 0; return; }
  if (renderTime >= to.t) { p.x = to.x; p.y = to.y; p.a = to.a; p.vx = p.vy = 0; return; }
  // Where it really went between the two reports it sits between, in Tiles a
  // second. It is the way of the travel and not the way of the nose: a Mower
  // that is pushed sideways points one way and moves another.
  const span = (to.t - from.t) / 1000;
  p.vx = (to.x - from.x) / span;
  p.vy = (to.y - from.y) / span;
  const k = (renderTime - from.t) / (to.t - from.t);
  p.x = from.x + (to.x - from.x) * k;
  p.y = from.y + (to.y - from.y) * k;
  p.a = blendAngle(from.a, to.a, k);
}

/**
 * The Mowers the field draws this frame, your own Mower first.
 *
 * The field holds `MOWER_SLOTS` models and the Lawn may hold more Mowers than
 * that, so a busy Lawn has to choose. It keeps your own Mower, always: a
 * Mower that cannot see itself cannot drive. The rest of the slots go to the
 * Mowers nearest you, because those are the ones on the screen, and a Mower
 * over the horizon that holds a slot is a slot nobody sees.
 *
 * The name plate, the Stars and the Emotes of a Mower with no slot are still
 * drawn: the HUD has no such limit, and a Mower far enough away to lose its
 * model is drawn as a dot on the map either way.
 */
function allMowers() {
  const seat = (p) => ({ x: p.x, y: p.y, a: p.a, hue: p.hue, me: false });
  const mine = { x: me.x, y: me.y, a: me.a, hue: myHue, me: true };
  const others = [...peers.values()];
  if (others.length + 1 > MOWER_SLOTS) {
    others.sort((a, b) => (a.x - me.x) ** 2 + (a.y - me.y) ** 2
                        - ((b.x - me.x) ** 2 + (b.y - me.y) ** 2));
    others.length = MOWER_SLOTS - 1;
  }
  return [mine, ...others.map(seat)];
}

/* ------------------------------------------------------------------ *
 * the field: instanced 3D blades, one sun, one depth buffer
 * ------------------------------------------------------------------ */

const FIELD_WGSL = `struct Cam {
  viewProj : mat4x4f,
  lightVP  : mat4x4f,
  eye      : vec4f,   // xyz the camera; w the projection's x scale
  sun      : vec4f,   // xyz towards the sun; w the projection's y scale
  misc     : vec4f,   // time, patch origin in cells (x, y), blades per row
  misc2    : vec4f,   // grid w, grid h, cell size, blade height
  opts     : vec4f,   // mower count, mower scale, ambient, daylight 0..1
  sunCol   : vec4f,   // rgb; w is cloud drift in Tiles
  skyCol   : vec4f,   // rgb; w is one over the sun's half extent
  mowers   : array<vec4f, ${MOWER_SLOTS}>,    // x, z, heading, cutting vibration
  mowerCol : array<vec4f, ${MOWER_SLOTS}>,    // paint
  ball : vec4f, // x, height, y, radius
  ballRoll : vec4f,
};

@group(0) @binding(0) var<uniform> C : Cam;
/** One texel per Tile: r is Blade Height, g and b the cut heading as cos and sin. */
@group(0) @binding(1) var field : texture_2d<f32>;
@group(0) @binding(2) var fieldSamp : sampler;
@group(0) @binding(3) var shadowMap : texture_depth_2d;
@group(0) @binding(4) var shadowSamp : sampler_comparison;

/** One blade, worked out once per frame by the compute pass. */
struct BladeData {
  root   : vec2f,   // where it grows, in Tiles
  fwd    : vec2f,   // which way it leans
  bladeH : f32,
  lean   : f32,
  halfW  : f32,     // at the base
  tc     : u32,     // tint and cut, two 16-bit unorms
};
struct DrawArgs { vertexCount : u32, instanceCount : atomic<u32>, firstVertex : u32, firstInstance : u32 };
@group(0) @binding(5) var<storage, read> Blades : array<BladeData>;
/**
 * The still parts of the ground, baked once: verge, lawn edge and the two
 * coarse noises. GROUND_RES texels per Tile, GROUND_MARGIN Tiles around the
 * Lawn; past that the edge texel repeats, and the edge is bare there anyway.
 */
@group(0) @binding(8) var groundTex : texture_2d<f32>;
const GROUND_RES = 4.0;
const GROUND_MARGIN = 12.0;
@group(0) @binding(6) var<storage, read_write> Grown : array<BladeData>;
@group(0) @binding(7) var<storage, read_write> Draw : DrawArgs;

/** One flower or clover, worked out once per frame by the compute pass. */
struct BloomData {
  root : vec2f,
  size : f32,   // 0 for an empty cell, and then it is never drawn
  tall : f32,   // a flower's height; a clover's r.y
  sway : f32,
  spin : f32,   // r.x, which way it turns
  kind : f32,   // a flower's cluster variety; a clover's r.w
  pad  : f32,
};
@group(0) @binding(9) var<storage, read> Flowers : array<BloomData>;
@group(0) @binding(10) var<storage, read> Clovers : array<BloomData>;
@group(0) @binding(11) var<storage, read_write> FlowersOut : array<BloomData>;
@group(0) @binding(12) var<storage, read_write> FlowerDraw : DrawArgs;
@group(0) @binding(13) var<storage, read_write> CloversOut : array<BloomData>;
@group(0) @binding(14) var<storage, read_write> CloverDraw : DrawArgs;

/** Bilinear, so a mown edge is a curve and not a staircase of Tiles. The sampler does it. */
fn hSmooth(p : vec2f) -> f32 {
  return textureSampleLevel(field, fieldSamp, p / C.misc2.xy, 0.0).x;
}

// Blend vectors instead of angles so headings wrap smoothly at ±pi. The four
// Tiles come from two gathers at the corner between them: w is (x0, y0),
// z is (x1, y0), x is (x0, y1) and y is (x1, y1).
fn cutSmooth(p : vec2f) -> vec2f {
  let q = p - vec2f(0.5);
  let f = floor(q);
  let t = smoothstep(vec2f(0.0), vec2f(1.0), fract(q));
  let corner = (f + vec2f(1.0)) / C.misc2.xy;
  let cx = textureGather(1, field, fieldSamp, corner) * 2.0 - 1.0;
  let sy = textureGather(2, field, fieldSamp, corner) * 2.0 - 1.0;
  return mix(mix(vec2f(cx.w, sy.w), vec2f(cx.z, sy.z), t.x),
             mix(vec2f(cx.x, sy.x), vec2f(cx.y, sy.y), t.x), t.y);
}

fn hash4(c : vec2f) -> vec4f {
  var p = fract(vec3f(c.xyx) * vec3f(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yzx + 33.33);
  let a = fract((p.xxy + p.yzz) * p.zyx);
  var q = fract(vec3f(c.yxy) * vec3f(0.1231, 0.0973, 0.1099));
  q += dot(q, q.zyx + 21.17);
  return vec4f(a, fract((q.xzy + q.yxz) * q.yzx).x);
}
/** The x of hash4, and nothing else: the same value for half the work. */
fn hash1(c : vec2f) -> f32 {
  var p = fract(vec3f(c.xyx) * vec3f(0.1031, 0.1030, 0.0973));
  p += dot(p, p.yzx + 33.33);
  return fract((p.x + p.y) * p.z);
}
/** Interpolated value noise: no cell edges, no sine ripple. */
fn vnoise(p : vec2f) -> f32 {
  let i = floor(p);
  let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash1(i), hash1(i + vec2f(1.0, 0.0)), u.x),
             mix(hash1(i + vec2f(0.0, 1.0)), hash1(i + vec2f(1.0, 1.0)), u.x), u.y);
}

// The map itself, built from the one table in fields.js: the Fields, the
// lanes between them and the Ditches. The ground a Mower drives on and the
// ground it sees are therefore the same map, and cannot drift apart.
${MAP_WGSL}

/** The face of the water, for its normal. It drifts with the clock. */
fn ripple(p : vec2f, t : f32) -> f32 {
  return vnoise(p * 1.7 + vec2f(t * 0.32, t * 0.07)) * 0.62
       + vnoise(p * 3.9 - vec2f(t * 0.44, t * 0.11)) * 0.38;
}

fn cloverDensity(root : vec2f) -> f32 {
  let clusterCell = floor(root / 21.0);
  let cluster = hash4(clusterCell + 219.7);
  let centre = clusterCell * 21.0 + vec2f(6.0) + cluster.xy * 9.0;
  let distance = length((root - centre) / vec2f(1.0, 0.7 + cluster.x * 0.5));
  return (1.0 - smoothstep(1.1, 2.4, distance + (vnoise(root) - 0.5) * 0.7))
              * step(0.60, cluster.z);
}

fn lawnEdge(p : vec2f) -> f32 {
  let edge = min(min(p.x, C.misc2.x - p.x), min(p.y, C.misc2.y - p.y));
  return smoothstep(-5.0, 4.0, edge + (vnoise(p * 0.18) - 0.5) * 4.0);
}

// Project overhead cloud cover along the sun direction, independent of the camera.
const CLOUD_HEIGHT = 13.0;
fn cloudCover(p : vec2f) -> f32 {
  let q = (p - vec2f(C.sunCol.w, C.sunCol.w * 0.35)) * 0.065;
  let shape = vnoise(q) * 0.78 + vnoise(q * 2.7 + vec2f(17.3)) * 0.22;
  return smoothstep(0.48, 0.70, shape);
}

/** How much sun reaches a point, from the sun's own depth map. */
fn sunlight(w : vec3f) -> f32 {
  let lp = C.lightVP * vec4f(w, 1.0);
  let ndc = lp.xyz / lp.w;
  let uv = vec2f(ndc.x * 0.5 + 0.5, 0.5 - ndc.y * 0.5);
  // No early exits: textureSampleCompare may only be called from uniform
  // control flow, so sample first and mask the result afterwards.
  let inside = ndc.z <= 1.0 && ndc.z >= 0.0 &&
               uv.x >= 0.0 && uv.x <= 1.0 && uv.y >= 0.0 && uv.y <= 1.0;
  let texel = 1.0 / 1536.0;
  let depth = clamp(ndc.z - 0.0016, 0.0, 1.0);
  var sum = 0.0;
  for (var y = -1; y <= 1; y = y + 1) {
    for (var x = -1; x <= 1; x = x + 1) {
      let at = clamp(uv + vec2f(f32(x), f32(y)) * texel, vec2f(0.0), vec2f(1.0));
      sum = sum + textureSampleCompare(shadowMap, shadowSamp, at, depth);
    }
  }
  let rim = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));
  return mix(1.0, select(1.0, sum / 9.0, inside), smoothstep(0.0, 0.12, rim));
}

/* ---------------- the grass ---------------- */

struct Blade {
  world : vec3f,
  nrm   : vec3f,
  t     : f32,
  tint  : f32,
  cut   : f32,
};

/**
 * Everything about a blade that its ten vertices share. The compute pass
 * works it out once per blade per frame; before, every vertex of both
 * passes did it again, twenty times over.
 */
fn growBlade(ii : u32) -> BladeData {
  let perRow = u32(C.misc.w);
  let cellSize = C.misc2.z;
  // misc.yz is the patch origin as a whole number of cells, so every blade
  // keeps the same world cell as the patch slides under the camera.
  let cellIdx = C.misc.yz + vec2f(f32(ii % perRow), f32(ii / perRow));
  let jitter = hash4(cellIdx);
  let root = (cellIdx + jitter.xy) * cellSize;

  let r = hash4(root * 91.7);
  // Sample the height a step away from the root, so blades straddle the edge
  // of a cut instead of lining up along it. The step is mostly a coherent
  // field, which makes clumps push into the path rather than lone spikes.
  let wobble = vec2f(vnoise(root * 1.25) - 0.5, vnoise(root * 1.25 + 7.3) - 0.5) * 1.5
             + (r.xy - vec2f(0.5)) * 0.45;
  let h = hSmooth(root + wobble);

  let verge = pathGrass(root);
  let density = lawnEdge(root) * verge;
  let patchCentre = (C.misc.yz + vec2f(C.misc.w * 0.5)) * cellSize;
  let patchEdge = C.misc.w * cellSize * 0.5 - max(abs(root.x - patchCentre.x), abs(root.y - patchCentre.y));
  let onLawn = smoothstep(r.x * 0.55, r.x * 0.55 + 0.45, density)
             * smoothstep(0.0, 6.0, patchEdge);
  let time = C.misc.x;

  // Which way it points, and how far it leans over.
  let face = r.z * 6.2831853;
  let direction = mix(vec2f(cos(face), sin(face)), cutSmooth(root), (1.0 - h) * 0.85);
  let gust = sin(time * 1.3 + root.x * 0.7 + root.y * 0.5) * 0.5 + 0.5;

  var d : BladeData;
  d.root = root;
  d.fwd = direction / max(length(direction), 0.001);
  d.bladeH = C.misc2.w * (0.55 + 0.75 * r.w) * (0.10 + 0.90 * h) * onLawn * mix(0.25, 1.0, verge)
           * mix(1.0, 0.75, cloverDensity(root));
  d.lean = (0.25 + 0.35 * r.x + 0.25 * gust) + (1.0 - h) * 0.65;
  d.halfW = C.misc2.w * 0.055 * (0.75 + 0.5 * r.y) * onLawn;
  d.tc = pack2x16unorm(vec2f(r.w, 1.0 - smoothstep(0.0, 0.45, h)));
  return d;
}

/** One vertex of a grown blade. */
fn bladeAt(vi : u32, ii : u32) -> Blade {
  let d = Blades[ii];
  let tc = unpack2x16unorm(d.tc);
  let seg = vi / 2u;
  let side = f32(vi % 2u) * 2.0 - 1.0;
  let t = f32(seg) / 4.0;

  // The blade arcs: it rises fast, then bends over towards its tip.
  let rise = d.bladeH * (t - d.lean * t * t * 0.55);
  let away = d.bladeH * d.lean * t * t;
  let halfW = d.halfW * (1.0 - pow(t, 0.7));

  let fwd = d.fwd;
  let sideDir = vec3f(-fwd.y, 0.0, fwd.x);
  let centre = vec3f(d.root.x + fwd.x * away, rise, d.root.y + fwd.y * away);

  let tangent = normalize(vec3f(fwd.x * d.lean * 0.9, 1.0 - d.lean * 0.5, fwd.y * d.lean * 0.9));
  var n = normalize(cross(sideDir, tangent));
  n = normalize(n + sideDir * side * 0.35);   // round the blade a little

  var b : Blade;
  b.world = centre + sideDir * (side * halfW);
  b.nrm = n;
  b.t = t;
  b.tint = tc.x;
  b.cut = tc.y;
  return b;
}

/**
 * Grow the patch. A blade is kept when it has height and the camera or the
 * sun can see it; the rest never reach a vertex shader. The test is in clip
 * space, with a margin of two Tiles: more than a blade can rise or lean.
 */
@compute @workgroup_size(64)
fn cs_grow(@builtin(global_invocation_id) gid : vec3u) {
  let perRow = u32(C.misc.w);
  if (gid.x >= perRow * perRow) { return; }
  let d = growBlade(gid.x);
  if (d.bladeH < 0.001) { return; }
  let e = 2.0;
  let base = vec4f(d.root.x, 0.0, d.root.y, 1.0);
  let cam = C.viewProj * base;
  let sun = C.lightVP * base;
  let byCamera = cam.z > -e && cam.z <= cam.w + e
              && abs(cam.x) <= cam.w + e * (C.eye.w + 1.0)
              && abs(cam.y) <= cam.w + e * (C.sun.w + 1.0);
  let bySun = abs(sun.x) <= 1.0 + e * C.skyCol.w && abs(sun.y) <= 1.0 + e * C.skyCol.w;
  if (!(byCamera || bySun)) { return; }
  Grown[atomicAdd(&Draw.instanceCount, 1u)] = d;
}

struct VSOut {
  @builtin(position) pos : vec4f,
  @location(0) nrm  : vec3f,
  @location(1) t    : f32,
  @location(2) tint : f32,
  @location(3) wpos : vec3f,
  @location(4) cut  : f32,
};

@vertex
fn vs_blade(@builtin(vertex_index) vi : u32, @builtin(instance_index) ii : u32) -> VSOut {
  let b = bladeAt(vi, ii);
  var o : VSOut;
  o.pos = C.viewProj * vec4f(b.world, 1.0);
  o.nrm = b.nrm; o.t = b.t; o.tint = b.tint; o.wpos = b.world; o.cut = b.cut;
  return o;
}

@vertex
fn vs_blade_shadow(@builtin(vertex_index) vi : u32, @builtin(instance_index) ii : u32) -> @builtin(position) vec4f {
  return C.lightVP * vec4f(bladeAt(vi, ii).world, 1.0);
}

/** Sunlight, sky fill and soft shadows. */
fn shade(base : vec3f, n : vec3f, wpos : vec3f, aoIn : f32) -> vec3f {
  let sun = normalize(C.sun.xyz);
  let lam = max(dot(n, sun), 0.0);
  let cloudPoint = wpos.xz + sun.xz * max(0.0, CLOUD_HEIGHT - wpos.y) / max(sun.y, 0.15);
  let vis = sunlight(wpos) * (1.0 - cloudCover(cloudPoint) * 0.55);
  let sky = C.skyCol.rgb * (C.opts.z * (0.65 + 0.35 * n.y));
  let ballHeight = max(0.0, C.ball.y - C.ball.w);
  let footprint = length(wpos.xz - C.ball.xz) / (C.ball.w + ballHeight * 0.12 + 0.001);
  let contact = (1.0 - smoothstep(0.25, 1.5, footprint)) * 0.27 / (1.0 + ballHeight * 0.15)
    * (1.0 - smoothstep(0.0, 1.2, wpos.y)) * step(0.1, C.ball.w);
  return base * (sky + C.sunCol.rgb * lam * mix(0.3, 1.0, vis)) * aoIn * (1.0 - contact);
}

@fragment
fn fs_blade(i : VSOut) -> @location(0) vec4f {
  var n = normalize(i.nrm);
  let view = normalize(C.eye.xyz - i.wpos);
  if (dot(n, view) < 0.0) { n = -n; }

  var base = mix(vec3f(0.24, 0.48, 0.12), vec3f(0.43, 0.66, 0.22), i.tint);
  base = mix(base, vec3f(0.64, 0.88, 0.34), smoothstep(0.5, 1.0, i.t) * 0.5);
  base = mix(base, vec3f(0.70, 0.85, 0.38), i.cut * 0.5);    // a cut blade is pale

  let ao = mix(0.70, 1.0, smoothstep(0.0, 0.65, i.t));
  return vec4f(shade(base, n, i.wpos, ao), 1.0);
}

/* ---------------- the ground ---------------- */

/** What the ground bake stores per texel: verge, lawn edge, coarse dirt, coarse grain. */
fn groundStill(w : vec2f) -> vec4f {
  return vec4f(pathGrass(w), lawnEdge(w), vnoise(w * 0.65), vnoise(w * 1.4));
}

struct BakeOut { @builtin(position) pos : vec4f, @location(0) w : vec2f };

@vertex
fn vs_bake(@builtin(vertex_index) vi : u32) -> BakeOut {
  // One triangle over the whole target; its uv is the same one groundColour samples with.
  let uv = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u));
  var o : BakeOut;
  o.pos = vec4f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0, 0.0, 1.0);
  o.w = uv * (C.misc2.xy + 2.0 * GROUND_MARGIN) - vec2f(GROUND_MARGIN);
  return o;
}

@fragment
fn fs_bake(i : BakeOut) -> @location(0) vec4f { return groundStill(i.w); }

fn groundColour(w : vec2f) -> vec3f {
  let still = textureSampleLevel(groundTex, fieldSamp,
    (w + vec2f(GROUND_MARGIN)) / (C.misc2.xy + 2.0 * GROUND_MARGIN), 0.0);
  // Break both edges with noise, so neither the cut nor the border is a line.
  // Only the fine grain is still worked out per pixel; the rest is baked.
  let grain = (vnoise(w * 5.0) - 0.5) * 0.7 + (still.w - 0.5) * 1.3;
  let h = hSmooth(w) * 0.5
        + (hSmooth(w + vec2f(0.65, 0.0)) + hSmooth(w - vec2f(0.65, 0.0))
        + hSmooth(w + vec2f(0.0, 0.65)) + hSmooth(w - vec2f(0.0, 0.65))) * 0.125
        + grain * 0.08;
  let soil = vec3f(0.20, 0.40, 0.13);
  // A real lawn stripes because the deck lays the grass over. Same here.
  let stripe = 0.5 + 0.5 * cutSmooth(w).x;
  let cutG = mix(vec3f(0.38, 0.59, 0.20), vec3f(0.46, 0.66, 0.26), stripe);
  var col = mix(soil, cutG, 1.0 - smoothstep(0.0, 0.85, h));
  let dirt = mix(vec3f(0.22, 0.12, 0.065), vec3f(0.34, 0.22, 0.12),
                 still.z * 0.7 + vnoise(w * 8.0) * 0.3);
  let verge = still.x;
  let worn = mix(dirt, vec3f(0.31, 0.34, 0.14), 0.6);
  col = mix(mix(dirt, worn, smoothstep(0.0, 0.5, verge)),
            col, smoothstep(0.35, 1.0, verge));
  return mix(vec3f(0.38, 0.48, 0.24), col, still.y);
}

struct GOut { @builtin(position) pos : vec4f, @location(0) w : vec2f };

fn groundVertex(vi : u32) -> vec2f {
  var q = array<vec2f, 6>(vec2f(0.0, 0.0), vec2f(1.0, 0.0), vec2f(0.0, 1.0),
                          vec2f(1.0, 0.0), vec2f(1.0, 1.0), vec2f(0.0, 1.0));
  let lo = vec2f(-200.0, -200.0);
  let hi = vec2f(C.misc2.x + 200.0, C.misc2.y + 200.0);
  return lo + q[vi] * (hi - lo);
}

@vertex
fn vs_ground(@builtin(vertex_index) vi : u32) -> GOut {
  let w = groundVertex(vi);
  var o : GOut;
  // a hair below the blades, so the two do not fight for the same depth
  o.pos = C.viewProj * vec4f(w.x, -0.015, w.y, 1.0);
  o.w = w;
  return o;
}

@fragment
fn fs_ground(i : GOut) -> @location(0) vec4f {
  let w3 = vec3f(i.w.x, -0.015, i.w.y);
  var n = vec3f(0.0, 1.0, 0.0);
  var base = groundColour(i.w);
  let depth = waterAt(i.w);
  let wetness = smoothstep(-0.15, 0.55, depth);
  if (wetness > 0.0) {
    // A face of moving water, from the slope of the ripple either side.
    let e = 0.4;
    let h0 = ripple(i.w, C.misc.x);
    let slope = vec2f(ripple(i.w + vec2f(e, 0.0), C.misc.x) - h0,
                      ripple(i.w + vec2f(0.0, e), C.misc.x) - h0) * (2.6 / e);
    n = normalize(mix(n, normalize(vec3f(-slope.x, 1.0, -slope.y)), wetness));
    // Shallow water keeps the colour of the bed; deep water loses it.
    let deep = smoothstep(0.0, DITCH, depth);
    base = mix(base, mix(vec3f(0.22, 0.34, 0.28), vec3f(0.05, 0.15, 0.19), deep), wetness);
  }
  // The daze of the shadow map may only be read from uniform control flow,
  // so the water changes what is shaded and never whether it is shaded.
  var col = shade(base, n, w3, 1.0);
  let view = normalize(C.eye.xyz - w3);
  // A shader that uses a WGSL reserved word is dropped in silence, and the
  // usual name for this vector is one of them. It is the half vector.
  let midway = normalize(normalize(C.sun.xyz) + view);
  // The sun on the water, and the sky lying on it at a low angle.
  col += C.sunCol.rgb * pow(max(dot(n, midway), 0.0), 48.0) * wetness * 0.85;
  col = mix(col, C.skyCol.rgb, wetness * 0.18 * (1.0 - abs(dot(n, view))));
  return vec4f(col, 1.0);
}

/* ---------------- wildflowers ---------------- */

struct FlowerOut {
  @builtin(position) pos : vec4f,
  @location(0) world : vec3f,
  @location(1) colour : vec3f,
};

fn growFlower(ii : u32) -> BloomData {
  let count = u32(ceil(C.misc.w / 4.0));
  let cell = floor(C.misc.yz / 4.0) + vec2f(f32(ii % count), f32(ii / count));
  let r = hash4(cell + 43.8);
  let root = (cell + r.xy) * C.misc2.z * 4.0;
  let clusterCell = floor(root / 24.0);
  let cluster = hash4(clusterCell + 127.3);
  let centre = clusterCell * 24.0 + vec2f(8.0) + cluster.xy * 8.0;
  let offset = (root - centre) / vec2f(1.0, 0.75 + cluster.w * 0.45);
  let radius = 3.0 + cluster.z * 1.6;
  let fringe = (vnoise(root * 0.8) - 0.5) * 0.8;
  let density = (1.0 - smoothstep(radius - 0.8, radius + 0.5, length(offset) + fringe))
              * step(0.35, cluster.w);
  let bloom = step(r.z, density * 0.9) * pathGrass(root) * lawnEdge(root)
            * smoothstep(0.4, 0.85, hSmooth(root));
  let patchCentre = (C.misc.yz + vec2f(C.misc.w * 0.5)) * C.misc2.z;
  let edge = C.misc.w * C.misc2.z * 0.5 - max(abs(root.x - patchCentre.x), abs(root.y - patchCentre.y));
  var d : BloomData;
  d.root = root;
  d.size = bloom * smoothstep(0.0, 5.0, edge);
  d.tall = (0.65 + r.w * 0.35) * d.size;
  d.sway = sin(C.misc.x * 1.8 + root.x * 0.5 + root.y) * 0.08 * d.size;
  d.spin = r.x;
  d.kind = cluster.x;
  return d;
}

@vertex
fn vs_flower(@builtin(vertex_index) vi : u32, @builtin(instance_index) ii : u32) -> FlowerOut {
  let d = Flowers[ii];
  let root = d.root;
  let size = d.size;
  let height = d.tall;
  let sway = d.sway;
  let head = vec3f(root.x + sway, height, root.y);
  var world = head;
  var colour = vec3f(0.25, 0.43, 0.10);
  if (vi < 12u) {
    let quad = array<vec2f, 6>(vec2f(-1, 0), vec2f(1, 0), vec2f(1, 1),
                              vec2f(-1, 0), vec2f(1, 1), vec2f(-1, 1));
    let q = quad[vi % 6u];
    let side = select(vec3f(1, 0, 0), vec3f(0, 0, 1), vi >= 6u);
    world = vec3f(root.x + sway * q.y, height * q.y, root.y) + side * q.x * 0.022 * size;
  } else if (vi < 48u) {
    let petal = (vi - 12u) / 6u;
    let corners = array<vec2f, 6>(vec2f(0.03, 0), vec2f(0.18, -0.09), vec2f(0.31, 0),
                                 vec2f(0.03, 0), vec2f(0.31, 0), vec2f(0.18, 0.09));
    let q = corners[(vi - 12u) % 6u];
    let a = f32(petal) * 1.0471976 + d.spin * 6.2831853;
    world = head + vec3f(q.x * cos(a) - q.y * sin(a), q.x * 0.18,
                         q.x * sin(a) + q.y * cos(a)) * size;
    let variety = d.kind;
    colour = select(vec3f(0.98, 0.92, 0.73), vec3f(0.72, 0.43, 0.82), variety > 0.48);
    colour = select(colour, vec3f(0.98, 0.57, 0.48), variety > 0.68);
  } else {
    let k = (vi - 48u) % 3u;
    let a = f32((vi - 48u) / 3u + select(0u, 1u, k == 2u)) * 1.0471976;
    let radius = select(0.085, 0.0, k == 0u) * size;
    world = head + vec3f(cos(a) * radius, 0.025 * size, sin(a) * radius);
    colour = vec3f(1.0, 0.68, 0.15);
  }
  var o : FlowerOut;
  o.world = world;
  o.colour = colour;
  o.pos = C.viewProj * vec4f(world, 1);
  return o;
}

fn growClover(ii : u32) -> BloomData {
  let count = u32(ceil(C.misc.w / 3.0));
  let cell = floor(C.misc.yz / 3.0) + vec2f(f32(ii % count), f32(ii / count));
  let r = hash4(cell + 317.2);
  let root = (cell + r.xy) * C.misc2.z * 3.0;
  let density = cloverDensity(root);
  let patchCentre = (C.misc.yz + vec2f(C.misc.w * 0.5)) * C.misc2.z;
  let edge = C.misc.w * C.misc2.z * 0.5 - max(abs(root.x - patchCentre.x), abs(root.y - patchCentre.y));
  var d : BloomData;
  d.root = root;
  d.size = step(r.z, density * 0.65) * pathGrass(root) * lawnEdge(root)
         * smoothstep(0.2, 0.65, hSmooth(root)) * smoothstep(0.0, 5.0, edge);
  d.tall = r.y;
  d.sway = sin(C.misc.x * 1.2 + root.x + root.y) * 0.025 * d.size;
  d.spin = r.x;
  d.kind = r.w;
  return d;
}

/** Flowers and clover are sparse: an empty cell is dropped here and never drawn. */
@compute @workgroup_size(64)
fn cs_flowers(@builtin(global_invocation_id) gid : vec3u) {
  let count = u32(ceil(C.misc.w / 4.0));
  if (gid.x >= count * count) { return; }
  let d = growFlower(gid.x);
  if (d.size < 0.001) { return; }
  FlowersOut[atomicAdd(&FlowerDraw.instanceCount, 1u)] = d;
}

@compute @workgroup_size(64)
fn cs_clover(@builtin(global_invocation_id) gid : vec3u) {
  let count = u32(ceil(C.misc.w / 3.0));
  if (gid.x >= count * count) { return; }
  let d = growClover(gid.x);
  if (d.size < 0.001) { return; }
  CloversOut[atomicAdd(&CloverDraw.instanceCount, 1u)] = d;
}

@vertex
fn vs_clover(@builtin(vertex_index) vi : u32, @builtin(instance_index) ii : u32) -> FlowerOut {
  let d = Clovers[ii];
  let root = d.root;
  let size = d.size;
  let leaf = vi / 24u;
  let corner = vi % 3u;
  let segment = (vi % 24u) / 3u;
  let outline = array<vec2f, 8>(vec2f(0.04, 0), vec2f(0.17, -0.13),
    vec2f(0.34, -0.15), vec2f(0.43, -0.07), vec2f(0.37, 0),
    vec2f(0.43, 0.07), vec2f(0.34, 0.15), vec2f(0.17, 0.13));
  var q = vec2f(0.23, 0);
  if (corner != 0u) { q = outline[(segment + corner - 1u) % 8u]; }
  let angle = f32(leaf) * 2.0943951 + d.spin * 6.2831853;
  let scale = size * (0.45 + d.kind * 0.25);
  let world = vec3f(root.x + (q.x * cos(angle) - q.y * sin(angle)) * scale + d.sway,
    (0.44 + d.tall * 0.12 + q.x * 0.1) * size,
    root.y + (q.x * sin(angle) + q.y * cos(angle)) * scale);
  var o : FlowerOut;
  o.world = world;
  o.colour = mix(vec3f(0.23, 0.43, 0.14), vec3f(0.32, 0.53, 0.18), d.kind);
  o.colour += vec3f(0.06, 0.09, 0.025) * (1.0 - smoothstep(0.01, 0.06, abs(q.y)));
  o.pos = C.viewProj * vec4f(world, 1);
  return o;
}

@fragment
fn fs_flower(i : FlowerOut) -> @location(0) vec4f {
  return vec4f(shade(i.colour, vec3f(0, 1, 0), i.world, 1.0), 1);
}

/* ---------------- the mower ---------------- */

struct Part { world : vec3f, nrm : vec3f, panel : f32 };
struct MVertex {
  @location(0) local : vec3f,
  @location(1) normal : vec3f,
  @location(2) material : f32,
};

fn mowerAt(v : MVertex, ii : u32) -> Part {
  let m = C.mowers[ii];
  let ca = cos(m.z);
  let sa = sin(m.z);
  let local = v.local;
  let nrm = v.normal;
  let panel = v.material;
  var sc = local * C.opts.y;
  sc.y += m.w * (0.018 + sin(C.misc.x * 32.0) * 0.018);
  sc.y += sc.x * sin(C.misc.x * 21.0) * m.w * 0.006;
  var p : Part;
  p.world = vec3f(m.x + sc.x * ca - sc.z * sa, sc.y, m.y + sc.x * sa + sc.z * ca);
  p.nrm = vec3f(nrm.x * ca - nrm.z * sa, nrm.y, nrm.x * sa + nrm.z * ca);
  p.panel = panel;
  return p;
}

struct MOut {
  @builtin(position) pos : vec4f,
  @location(0) nrm   : vec3f,
  @location(1) tint  : vec3f,
  @location(2) panel : f32,
  @location(3) wpos  : vec3f,
};

@vertex
fn vs_mower(v : MVertex, @builtin(instance_index) ii : u32) -> MOut {
  let p = mowerAt(v, ii);
  var o : MOut;
  o.pos = C.viewProj * vec4f(p.world, 1.0);
  o.nrm = p.nrm;
  o.tint = C.mowerCol[ii].rgb;
  o.panel = p.panel;
  o.wpos = p.world;
  return o;
}

@vertex
fn vs_mower_shadow(v : MVertex, @builtin(instance_index) ii : u32) -> @builtin(position) vec4f {
  return C.lightVP * vec4f(mowerAt(v, ii).world, 1.0);
}

@fragment
fn fs_mower(i : MOut) -> @location(0) vec4f {
  var base = i.tint;
  if (i.panel > 0.5) { base = vec3f(0.055, 0.065, 0.055); }
  if (i.panel > 1.5) { base = vec3f(0.31, 0.35, 0.32); }
  if (i.panel > 2.5) { base = vec3f(0.88, 0.87, 0.71); }
  return vec4f(shade(base, normalize(i.nrm), i.wpos, 1.0), 1.0);
}

/* ---------------- the ball ---------------- */
fn ballNormal(vi : u32) -> vec3f {
  let corners = array<vec2f, 6>(vec2f(0, 0), vec2f(1, 0), vec2f(0, 1),
    vec2f(1, 0), vec2f(1, 1), vec2f(0, 1));
  let face = vi / 6u;
  let uv = (vec2f(f32(face % 32u), f32(face / 32u)) + corners[vi % 6u]) / vec2f(32, 20);
  let latitude = uv.y * 3.14159265;
  let longitude = uv.x * 6.2831853;
  return vec3f(sin(latitude) * cos(longitude), cos(latitude), sin(latitude) * sin(longitude));
}
@vertex
fn vs_ball(@builtin(vertex_index) vi : u32) -> MOut {
  let n = ballNormal(vi);
  let world = C.ball.xyz + n * C.ball.w;
  var o : MOut;
  o.pos = C.viewProj * vec4f(world, 1);
  o.wpos = world;
  o.nrm = n;
  o.tint = vec3f(1);
  o.panel = 0;
  return o;
}
@vertex
fn vs_ball_shadow(@builtin(vertex_index) vi : u32) -> @builtin(position) vec4f {
  return C.lightVP * vec4f(C.ball.xyz + ballNormal(vi) * C.ball.w, 1);
}
@fragment
fn fs_ball(i : MOut) -> @location(0) vec4f {
  let n = normalize(i.nrm);
  let cx = cos(C.ballRoll.x); let sx = sin(C.ballRoll.x);
  let cy = cos(C.ballRoll.y); let sy = sin(C.ballRoll.y);
  let q = vec3f(n.x * cy + n.y * sy, -n.x * sy + n.y * cy, n.z);

  });
  if (ball) {
    C.set([ballVisual.x, ballVisual.z, ballVisual.y, BALL_RADIUS, ballVisual.rollX, ballVisual.rollY, 0, 0], BALL_OFFSET);
  }
  F.device.queue.writeBuffer(F.cam, 0, C);

  F.device.queue.writeBuffer(F.drawArgs, 0, F.drawReset);
  F.device.queue.writeBuffer(F.flowerArgs, 0, F.flowerReset);
  F.device.queue.writeBuffer(F.cloverArgs, 0, F.cloverReset);
  const enc = F.device.createCommandEncoder();

  // 0. once: the still parts of the ground. It needs the Lawn's size, which
  // is in the uniform, so it waits for the first frame after the hello.
  if (bakeGround) {
    const bakePass = enc.beginRenderPass({
      colorAttachments: [{ view: F.groundTex.createView(), loadOp: "clear", storeOp: "store" }],
    });
    bakePass.setBindGroup(0, F.bindCast);
    bakePass.setPipeline(F.bake);
    bakePass.draw(3);
    bakePass.end();
    bakeGround = false;
  }

  // 1. grow the patch: one record per blade, flower and clover that is kept
  const grow = enc.beginComputePass();
  grow.setBindGroup(0, F.bindGrow);
  grow.setPipeline(F.grow);
  grow.dispatchWorkgroups(Math.ceil(perRow * perRow / 64));
  grow.setPipeline(F.growFlowers);
  grow.dispatchWorkgroups(Math.ceil(Math.ceil(perRow / 4) ** 2 / 64));
  grow.setPipeline(F.growClover);
  grow.dispatchWorkgroups(Math.ceil(Math.ceil(perRow / 3) ** 2 / 64));
  grow.end();

  // 2. what the sun can see
  const castPass = enc.beginRenderPass({
    colorAttachments: [],
    depthStencilAttachment: {
      view: F.shadowView, depthClearValue: 1.0,
      depthLoadOp: "clear", depthStoreOp: "store",
    },
  });
  castPass.setBindGroup(0, F.bindCast);
  castPass.setPipeline(F.bladesCast);
  castPass.drawIndirect(F.drawArgs, 0);
  if (ms.length > 0) {
    castPass.setPipeline(F.mowersCast);
    castPass.setVertexBuffer(0, F.mowerBuffer);
    castPass.draw(F.mowerVertices, ms.length);
  }
  if (ball) { castPass.setPipeline(F.ballCast); castPass.draw(32 * 20 * 6); }
  castPass.end();

  // 3. what you can see
  const color = SAMPLES === 1
    ? { view: F.ctx.getCurrentTexture().createView(), clearValue: { r: air.skyCol[0], g: air.skyCol[1], b: air.skyCol[2], a: 1 }, loadOp: "clear", storeOp: "store" }
    : { view: F.colour.createView(), resolveTarget: F.ctx.getCurrentTexture().createView(), clearValue: { r: air.skyCol[0], g: air.skyCol[1], b: air.skyCol[2], a: 1 }, loadOp: "clear", storeOp: "discard" };
  const pass = enc.beginRenderPass({
    colorAttachments: [color],
    depthStencilAttachment: {
      view: F.depth.createView(), depthClearValue: 1.0,
      depthLoadOp: "clear", depthStoreOp: "store",
    },
  });
  pass.setBindGroup(0, F.bindMain);
  pass.setPipeline(F.ground); pass.draw(6);
  pass.setPipeline(F.blades); pass.drawIndirect(F.drawArgs, 0);
  pass.setPipeline(F.clover); pass.drawIndirect(F.cloverArgs, 0);
  pass.setPipeline(F.flowers); pass.drawIndirect(F.flowerArgs, 0);
  if (ms.length > 0) {
    pass.setPipeline(F.mowers);
    pass.setVertexBuffer(0, F.mowerBuffer);
    pass.draw(F.mowerVertices, ms.length);
  }
  if (ball) { pass.setPipeline(F.ballDraw); pass.draw(32 * 20 * 6); }
  pass.end();
  F.device.queue.submit([enc.finish()]);
}

/** A world point as a HUD pixel, through the camera the field was drawn with. */
function projector(cw, ch) {
  const m = F.camData;
  return (x, height, y) => {
    const w = m[3] * x + m[7] * height + m[11] * y + m[15];
    if (w <= 0) return null;
    return [((m[0] * x + m[4] * height + m[8] * y + m[12]) / w * 0.5 + 0.5) * cw,
      (0.5 - (m[1] * x + m[5] * height + m[9] * y + m[13]) / w * 0.5) * ch];
  };
}

function drawMowing(cw, ch, dpr) {
  const now = performance.now();
  const project = projector(cw, ch);
  g.save();
  if (mowing > 0.02) {
    const p = project(me.x + Math.cos(me.a) * 1.8, 0.22, me.y + Math.sin(me.a) * 1.8);
    if (p) {
      const glow = g.createRadialGradient(...p, 0, ...p, 24 * dpr);
      glow.addColorStop(0, `rgba(229,255,151,${mowing * 0.2})`);
      glow.addColorStop(1, "rgba(229,255,151,0)");
      g.fillStyle = glow;
      g.beginPath(); g.ellipse(...p, 24 * dpr, 12 * dpr, 0, 0, Math.PI * 2); g.fill();
    }
  }
  for (let i = clippings.length - 1; i >= 0; i--) {
    const c = clippings[i];
    const age = now - c.born;
    if (age >= c.life) { clippings.splice(i, 1); continue; }
    const t = age / 1000, progress = age / c.life;
    const p = project(c.x + c.vx * t, Math.max(0.05, 0.12 + c.up * t - 5 * t * t), c.y + c.vy * t);
    if (!p) continue;
    g.save();
    g.translate(...p); g.rotate(c.spin * t);
    g.globalAlpha = Math.min(1, (1 - progress) * 3) * (reducedMotion.matches ? 0.45 : 0.9);
    g.fillStyle = ["#a8cc58", "#d3e88b", "#71993e"][c.tint];
    g.beginPath();
    g.moveTo(-3 * dpr, 0); g.quadraticCurveTo(0, -3 * dpr, 5 * dpr, -dpr);
    g.lineTo(dpr, 2 * dpr); g.closePath(); g.fill();
    g.restore();
  }
  g.restore();
}

function drawBumps(cw, ch, dpr) {
  const now = performance.now();
  while (bumps.length && now - bumps[0].born > 480) bumps.shift();
  const project = projector(cw, ch);
  g.save();
  for (const bump of bumps) {
    const t = (now - bump.born) / 480;
    const p = project(bump.x, 0.8 + t * 0.9, bump.y);
    if (!p) continue;
    const [x, y] = p;
    const spread = (10 + 43 * (1 - (1 - t) ** 3)) * dpr;
    g.globalAlpha = (1 - t) ** 1.5 * 0.8;
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2 + 0.3;
      g.fillStyle = i % 2 ? "#c5bc91" : "#e5dab4";
      g.beginPath();
      g.arc(x + Math.cos(a) * spread, y + Math.sin(a) * spread * 0.6,
            (9 + t * 9) * dpr, 0, Math.PI * 2);
      g.fill();
    }
    if (t < 0.5) {
      g.globalAlpha = 1 - t * 2;
      g.strokeStyle = "#fff3bc";
      g.lineWidth = 4 * dpr;
      g.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        const a = -Math.PI * 0.85 + i * Math.PI * 0.35;
        g.beginPath();
        g.moveTo(x + Math.cos(a) * spread * 0.65, y + Math.sin(a) * spread * 0.65);
        g.lineTo(x + Math.cos(a) * (spread + 15 * dpr), y + Math.sin(a) * (spread + 15 * dpr));
        g.stroke();
      }
    }
  }
  g.restore();
}

/** One five-pointed Star, turned by `turn` radians. */
function starPath(x, y, r, turn) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = turn - Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r * 0.44 : r;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    if (i) g.lineTo(px, py); else g.moveTo(px, py);
  }
  g.closePath();
}

/**
 * A dazed Mower wears a ring of Stars. The ring is a circle in the world and
 * not on the screen, so it keeps the perspective of the Lawn: a Star behind
 * the Mower is drawn first, smaller and dimmer than the one in front of it.
 */
function drawStars(cw, ch, dpr) {
  const now = performance.now();
  const dazed = [];
  for (const p of peers.values()) {
    if (now - p.seen <= PEER_TIMEOUT && now < (p.stunUntil ?? 0)) {
      dazed.push({ x: p.x, y: p.y, until: p.stunUntil });
    }
  }
  if (now < stunUntil) dazed.push({ x: me.x, y: me.y, until: stunUntil });
  if (!dazed.length) return;
  const still = reducedMotion.matches;
  const project = projector(cw, ch);
  g.save();
  for (const d of dazed) {
    // 1 the moment of the bump, 0 when the Mower has its controls back.
    const left = Math.min(1, (d.until - now) / STUN_MS);
    const fade = Math.min(1, (1 - left) * 9) * Math.min(1, left * 5);
    const spin = still ? 0.6 : now * 0.005;
    const ring = [];
    for (let i = 0; i < 4; i++) {
      const a = spin + i * Math.PI / 2;
      const lift = still ? 0 : Math.sin(now * 0.006 + i) * 0.14;
      const p = project(d.x + Math.cos(a) * 1.6, MOWER_TOP + 1.4 + lift, d.y + Math.sin(a) * 1.6);
      // Sine of the angle is how near the Star is: the camera looks along the
      // Lawn from a greater y, so a greater y is nearer the eye.
      if (p) ring.push({ p, near: Math.sin(a) });
    }
    ring.sort((u, v) => u.near - v.near);
    for (const s of ring) {
      const near = s.near * 0.5 + 0.5;
      g.globalAlpha = fade * (0.5 + 0.5 * near);
      g.fillStyle = "#ffe066";
      g.strokeStyle = "rgba(58,44,10,.6)";
      g.lineWidth = 1.4 * dpr;
      starPath(s.p[0], s.p[1], (9 + 3.5 * near) * dpr, still ? 0 : now * 0.004);
      g.fill();
      g.stroke();
    }
  }
  g.restore();
}

/**
 * An Emote is a card in the air above the Mower, not a badge on it. The card
 * is measured in pixels and the Mower in world units, so the two are tied at
 * the top of the Mower: the card hangs its own height above that point and
 * clears the handlebar on a tall screen and a short one alike.
 */
const MOWER_TOP = 4.2;
/** How wide an Emote card is, in device pixels, on the Mower you drive. */
const EMOTE_SIZE = 92;
const PICKER_SIZE = 78;

/** A pop that goes past its size and comes back, the way a spring does. */
const popOut = (t) => {
  const u = t - 1;
  return 1 + 2.70158 * u * u * u + 1.70158 * u * u;
};
const easeOut = (t) => 1 - (1 - t) ** 3;

function drawEmotes(cw, ch, dpr) {
  const now = performance.now();
  const project = projector(cw, ch);
  const still = reducedMotion.matches;

  /**
   * How many pixels one world unit is worth where a Mower stands. A card far
   * away is drawn smaller, so it keeps the depth of the Lawn, and the measure
   * is taken against your own Mower, so your own card never changes size.
   */
  const unitAt = (x, y) => {
    const a = project(x, MOWER_TOP, y), b = project(x, MOWER_TOP + 1, y);
    return a && b ? Math.abs(a[1] - b[1]) : 0;
  };
  const here = unitAt(me.x, me.y);
  const depthScale = (x, y) => {
    if (!here) return 1;
    const there = unitAt(x, y);
    return there ? Math.min(1.1, Math.max(0.55, there / here)) : 1;
  };

  /**
   * One card. It squashes and tilts while it pops, and two dots under it tie
   * it to the Mower that sent it, the way a thought balloon does.
   */
  const bubble = (x, y, glyph, alpha, size, tilt = 0, squash = 1, stem = 0) => {
    if (!(alpha > 0.004) || !(size > 1)) return;
    const r = size / 2;
    g.save();
    g.globalAlpha = alpha;
    g.translate(x, y);
    for (let i = 0; i < 2 && stem > 0; i++) {
      g.fillStyle = "rgba(20,32,14,.62)";
      g.beginPath();
      g.arc(0, r + stem * (0.6 + i * 1.5), size * (0.075 - i * 0.028), 0, Math.PI * 2);
      g.fill();
    }
    if (tilt) g.rotate(tilt);
    g.scale(1 / squash, squash);
    g.fillStyle = "rgba(20,32,14,.74)";
    g.strokeStyle = "rgba(255,255,255,.34)";
    g.lineWidth = 1.6 * dpr;
    g.beginPath();
    g.roundRect(-r, -r, size, size, r * 0.44);
    g.fill();
    g.stroke();
    g.fillStyle = "#f4ffca";
    g.font = `${Math.round(size * 0.64)}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(glyph, 0, size * 0.04);
    g.restore();
  };

  g.save();

  // What every Mower shows now. The card springs in, breathes where it hangs,
  // and lifts away as it ages out.
  const showing = [];
  for (const p of peers.values()) {
    if (p.emote >= 0 && now - p.emoteAt < EMOTE_MS) showing.push({ x: p.x, y: p.y, e: p.emote, at: p.emoteAt });
  }
  if (myEmote >= 0 && now - myEmoteAt < EMOTE_MS) showing.push({ x: me.x, y: me.y, e: myEmote, at: myEmoteAt });
  for (const s of showing) {
    const anchor = project(s.x, MOWER_TOP, s.y);
    if (!anchor) continue;
    const age = now - s.at, t = age / EMOTE_MS;
    const born = Math.min(1, age / 230);
    const gone = Math.max(0, (age - (EMOTE_MS - 420)) / 420);
    const pop = still ? born : Math.max(0, popOut(born));
    const size = EMOTE_SIZE * dpr * pop * (1 - gone * 0.25) * depthScale(s.x, s.y);
    const alpha = Math.min(1, age / 110) * (1 - gone * gone);
    const stem = 9 * dpr * born;
    const float = still ? 0 : Math.sin(age / 360) * 4 * dpr;
    const rise = easeOut(t) * 12 * dpr + gone * gone * 70 * dpr;
    const x = anchor[0], y = anchor[1] - (size / 2 + stem * 2.4 + 6 * dpr + rise + float);
    // A ring leaves the card the moment it lands, so an Emote across the Lawn
    // catches the eye of a Mower who was looking elsewhere.
    if (!still && age < 340 && size > 1) {
      const k = age / 340;
      g.globalAlpha = (1 - k) * 0.55 * alpha;
      g.strokeStyle = "#e5ff97";
      g.lineWidth = 3.5 * dpr * (1 - k);
      g.beginPath();
      g.arc(x, y, size * (0.55 + k * 0.7), 0, Math.PI * 2);
      g.stroke();
    }
    bubble(x, y, EMOTES[s.e], alpha, size,
      still ? 0 : Math.sin(age / 470) * 0.05,
      still ? 1 : 1 + 0.32 * Math.sin(Math.PI * born) * (1 - born),
      stem);
  }

  // The picker is a fan above your own Mower, so your eyes stay where you
  // drive and the Mower never covers a choice. The cards arrive one after the
  // other, and the one you would send stands up out of the row.
  if (pickerOpen) {
    const anchor = project(me.x, MOWER_TOP, me.y);
    if (anchor) {
      const open = now - pickerAt;
      const n = EMOTES.length;
      // A narrow window gets a narrower fan: four cards must never run off it.
      const fit = Math.min(1, innerWidth / 560);
      const card = PICKER_SIZE * dpr * fit;
      const step = card * 1.18;
      const left = anchor[0] - (n - 1) / 2 * step;
      const base = anchor[1] - (card / 2 + 16 * dpr);
      for (let i = 0; i < n; i++) {
        const picked = i === pickerPick;
        const born = Math.min(1, Math.max(0, (open - i * 45) / 190));
        if (born <= 0) continue;
        const pop = still ? born : Math.max(0, popOut(born));
        const bend = (i - (n - 1) / 2) / ((n - 1) / 2);
        const lift = (16 * (1 - bend * bend) + (picked ? 18 : 0)) * dpr * fit * born;
        const float = still || !picked ? 0 : Math.sin(open / 240) * 3 * dpr;
        const x = left + i * step, y = base - lift - float;
        const size = card * (picked ? 1 : 0.78) * pop;
        if (picked && size > 1) {
          g.globalAlpha = born;
          g.fillStyle = "rgba(229,255,151,.22)";
          g.beginPath();
          g.arc(x, y, size * 0.76 + (still ? 0 : Math.sin(open / 200) * 2.5 * dpr), 0, Math.PI * 2);
          g.fill();
        }
        bubble(x, y, EMOTES[i], born * (picked ? 1 : 0.72), size);
      }
    }
  }

  g.restore();
}

/**
 * There is one map. In the corner it holds a window on the Lawn around the
 * Mower; M grows that same map out to the middle of the screen, where it
 * holds the whole Lawn. Nothing fades in over it and nothing is drawn twice:
 * the frame, the paths and the Mowers travel with it, so the corner is never
 * a second map that disagrees with the first.
 */
function mapOrigin(view, world, centre) {
  // A view wider than the Lawn centres it rather than pin it to one edge.
  if (view >= world) return (world - view) / 2;
  return Math.max(0, Math.min(world - view, centre - view / 2));
}

/** The whole map as one picture, painted once per size of Lawn. */
let mapPicture = null, mapPictureFor = "";

function mapImage() {
  const size = `${W}x${H}`;
  if (mapPictureFor !== size) {
    mapPicture = buildMapImage(W, H, 2);
    mapPictureFor = size;
  }
  return mapPicture;
}

/** Where a Field's name belongs: the middle of the Tiles the Field owns. */
let fieldMarks = [], fieldMarksFor = "";

function fieldCentres() {
  const size = `${W}x${H}`;
  if (fieldMarksFor === size) return fieldMarks;
  const sums = FIELD_NAMES.map(() => [0, 0, 0]);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const id = fieldAt(x + 0.5, y + 0.5, W, H);
    if (id < 0) continue;
    sums[id][0] += x + 0.5; sums[id][1] += y + 0.5; sums[id][2]++;
  }
  fieldMarks = sums.map(([x, y, n], i) => ({ name: FIELD_NAMES[i], x: x / n, y: y / n }));
  fieldMarksFor = size;
  return fieldMarks;
}

/**
 * Paint one map into the frame art at the given rectangle. `viewW` is how
 * much of the Lawn, in world units, the frame holds from side to side; the
 * height follows from the shape of the opening, so nothing is ever stretched.
 */
function paintMap(left, top, width, height, viewW, centreX, centreY, dpr, naming) {
  const mapX = left + width * 0.07, mapY = top + height * 0.14;
  const mapW = width * 0.86, mapH = height * 0.73;
  const viewH = viewW * mapH / mapW;
  const originX = mapOrigin(viewW, W, centreX);
  const originY = mapOrigin(viewH, H, centreY);
  const sx = mapW / viewW, sy = mapH / viewH;
  const point = (x, y) => [mapX + (x - originX) * sx, mapY + (y - originY) * sy];
  // A bigger map earns bigger markers, but not in proportion: an arrow three
  // times as wide as the corner's would be a blot on the Lawn it stands on.
  const mark = Math.sqrt(width / 300);
  const pixelW = Math.round(width * dpr), pixelH = Math.round(height * dpr);
  if (minimapCanvas.width !== pixelW || minimapCanvas.height !== pixelH) {
    minimapCanvas.width = pixelW; minimapCanvas.height = pixelH;
  }
  const g = minimapCanvas.getContext('2d');
  g.clearRect(0, 0, pixelW, pixelH);
  g.save();
  g.scale(dpr, dpr);
  g.translate(-left, -top);
  g.save();
  g.fillStyle = "#536d35";
  g.fillRect(left, top, width, height);
  // The window on the Lawn, cut out of the one picture of it. The map is
  // therefore the map: every parcel, every lane and every Ditch, and nothing
  // drawn a second time by hand. Only the window is drawn, so the corner map
  // costs what the corner shows and not what the whole Lawn would.
  const picture = mapImage();
  const perTile = picture.width / W;
  g.drawImage(picture, originX * perTile, originY * perTile, viewW * perTile, viewH * perTile,
    mapX, mapY, mapW, mapH);
  if (naming > 0) {
    g.globalAlpha = naming;
    g.font = `${Math.round(Math.max(11, width * 0.021))}px Georgia, serif`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.strokeStyle = "#1c2a14";
    g.lineWidth = 3;
    g.lineJoin = "round";
    g.fillStyle = "#f4ffca";
    for (const field of fieldCentres()) {
      const p = point(field.x, field.y);
      g.strokeText(field.name, ...p);
      g.fillText(field.name, ...p);
    }
    g.globalAlpha = 1;
  }
  for (const p of peers.values()) {
    if (performance.now() - p.seen > PEER_TIMEOUT) continue;
    g.fillStyle = `hsl(${p.hue} 75% 65%)`;
    g.strokeStyle = "#182413";
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(...point(p.x, p.y), 3.5 * mark, 0, Math.PI * 2); g.fill(); g.stroke();
  }
  if (ballVisual) {
    const [bx, by] = point(ballVisual.x, ballVisual.y);
    g.fillStyle = "#fff0bc";
    g.strokeStyle = "#bf4925";
    g.lineWidth = 2 * mark;
    g.beginPath(); g.arc(bx, by, 4 * mark, 0, Math.PI * 2); g.fill(); g.stroke();
  }
  const [x, y] = point(me.x, me.y);
  g.translate(x, y); g.rotate(me.a); g.scale(mark, mark);
  g.fillStyle = "#f4ffca";
  g.strokeStyle = "#243318";
  g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(6, 0); g.lineTo(-4, -4); g.lineTo(-2, 0); g.lineTo(-4, 4); g.closePath();
  g.fill(); g.stroke();
  g.restore();
  g.restore();
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(minimapOpening, 0, 0, pixelW, pixelH);
  g.globalCompositeOperation = 'source-over';
  g.drawImage(minimapFrame, 0, 0, pixelW, pixelH);
  hud.getContext('2d').drawImage(minimapCanvas, Math.round(left * dpr), Math.round(top * dpr));
}

const mapReady = () => minimapFrame.complete && minimapFrame.naturalWidth
  && minimapOpening.complete && minimapOpening.naturalWidth;

/**
 * How much of the Lawn the corner map holds, in Tiles. It is a neighbourhood
 * and not the Lawn: wide enough to hold the near bank of a Ditch and the
 * Bridge that crosses it, so a Mower can see where to drive round.
 */
const CORNER_VIEW = 110;

/**
 * The minimap owns the bottom right corner, so the touch buttons have to know
 * how much of it the map has taken. Both edges are published as a length in
 * from the bottom and the right, and only when they move: this runs every
 * frame. They stay the corner's own measurements while the map is out, so
 * the buttons do not follow it across the screen and back.
 */
let mapTop = -1, mapSide = -1;

function drawMap(cw, ch, dpr) {
  if (!mapReady()) return;
  // A phone held sideways runs out of height first, so cap against both.
  const cornerW = Math.min(300, innerWidth * (compact.matches ? 0.38 : 0.41), innerHeight * 0.56);
  const margin = 16;
  // Clear the home button bar, and the credit line that sits under the map.
  const floor = margin + safeBottom + (compact.matches ? 18 : 0);
  const cornerLeft = cw / dpr - cornerW - margin;
  const cornerTop = ch / dpr - cornerW * 0.75 - floor;
  const fromBottom = Math.round(cornerW * 0.75 + floor), fromRight = Math.round(cornerW + margin);
  if (fromBottom !== mapTop || fromRight !== mapSide) {
    mapTop = fromBottom; mapSide = fromRight;
    document.documentElement.style.setProperty("--map-top", `${fromBottom}px`);
    document.documentElement.style.setProperty("--map-side", `${fromRight}px`);
  }

  const shift = mapShift();
  const bigW = Math.min(1100, innerWidth * 0.86, innerHeight * 0.86 / 0.75);
  const bigLeft = (cw / dpr - bigW) / 2, bigTop = (ch / dpr - bigW * 0.75) / 2;
  // The Lawn is wider than it is tall, and so is the opening, but not by the
  // same amount: fit the taller of the two and let the Lawn keep a verge.
  const bigView = Math.max(W, H * 0.86 / (0.73 * 0.75)) * 1.04;
  const between = (a, b) => a + (b - a) * shift;
  const width = between(cornerW, bigW);
  // The window on the Lawn widens by the same factor every frame, so the
  // ground under the frame runs out at an even pace rather than bolt at the
  // end. Each step of the walk out is worth as much as the last.
  const view = CORNER_VIEW * Math.pow(bigView / CORNER_VIEW, shift);
  // A map that fills the screen has the room to name the Fields; the corner
  // has room for none of it, so the names arrive with the space to hold them.
  const naming = Math.max(0, (shift - 0.45) / 0.55);

  if (shift > 0) {
    const hg = hud.getContext('2d');
    hg.save();
    hg.globalAlpha = shift * 0.45;
    hg.fillStyle = "#0b1207";
    hg.fillRect(0, 0, cw, ch);
    hg.restore();
  }
  paintMap(between(cornerLeft, bigLeft), between(cornerTop, bigTop), width, width * 0.75,
    view, between(me.x, W / 2), between(me.y, H / 2), dpr, naming);
}

function drawHud() {
  const dpr = Math.min(devicePixelRatio || 1, innerWidth * innerHeight > 7000000 ? 1 : 1.35);
  const cw = Math.round(innerWidth * dpr), ch = Math.round(innerHeight * dpr);
  if (hud.width !== cw || hud.height !== ch) { hud.width = cw; hud.height = ch; }
  g.clearRect(0, 0, cw, ch);
  updateScore(bladesCut, performance.now());
  drawMowing(cw, ch, dpr);
  drawBumps(cw, ch, dpr);
  drawStars(cw, ch, dpr);
  drawEmotes(cw, ch, dpr);
  drawMap(cw, ch, dpr);
}

setTimeout(() => (help.style.opacity = "0"), 8000);

let last = performance.now();
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - last) / 1000);
  // The quickest frame ever seen is the display's own interval. The empty
  // frames before the Lawn arrives run at exactly that rate.
  if (ts - last > 3) refresh = Math.min(refresh, ts - last);
  gapTotal += ts - last;
  gapCount++;
  last = ts;
  if (!mownAt || !F) return;
  const now = Date.now() + clockOffset;
  drive(dt);
  animateBall(ts);
  if (boardOpen && ts - boardAt > 250) { refreshBoard(); boardAt = ts; }
  fieldQuests.update(me.x, me.y, ts, i => heightAt(i, now));
  render(now, ts);
  drawHud();
  tuneFieldScale(ts);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

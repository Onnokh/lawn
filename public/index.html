<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>keepmow.ing — one lawn, everybody's</title>
<meta name="description" content="One shared lawn for everybody. Drive the mower, cut the grass. It grows back whether you are here or not." />
<style>
  * { box-sizing: border-box; }
  :root { --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: #cbdcc2;
    color: #fff;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    /* A thumb on the field must not pull the page down or rubber-band it. */
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 100dvh, not 100vh: the canvases are sized from innerHeight, and on a phone
     only the dynamic viewport agrees with it while the browser bars move. */
  #gpu, #hud { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; }
  #brand {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    margin: 0; z-index: 10; pointer-events: none;
    font-size: clamp(30px, 5.2vw, 66px); font-weight: 800; letter-spacing: -.03em;
    color: #fff; text-shadow: 0 2px 24px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.35);
  }
  #help {
    /* The brand starts 18px down and its line box is 1.5 times its font size,
       because it inherits the body line height. Clear all of that, then a gap. */
    position: fixed; top: calc(18px + 1.5 * clamp(30px, 5.2vw, 66px) + 10px); left: 50%;
    transform: translateX(-50%); z-index: 10; pointer-events: none;
    /* left:50% leaves only half the viewport to wrap in, so ask for the
       text's own width and cap it against the screen instead. */
    width: max-content; max-width: min(92vw, 820px); text-align: center;
    font-size: 13px; letter-spacing: .04em; color: #fff;
    text-shadow: 0 1px 10px rgba(0,0,0,.5);
    transition: opacity .8s ease;
  }
  #score {
    position: fixed; bottom: calc(38px + var(--safe-bottom)); left: 50%;
    transform: translateX(-50%); z-index: 10; pointer-events: none;
    color: #f1ffd7; font-size: clamp(24px, 3.1vw, 42px); line-height: 1;
    font-weight: 900; letter-spacing: .02em; text-align: center;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 16px rgba(0,0,0,.58), 0 1px 2px rgba(0,0,0,.45);
  }
  #score number-flow { --number-flow-mask-height: .08em; }
  #mower-count {
    display: block; margin-bottom: 8px; text-align: center;
    font-size: 12px; line-height: 1.4; font-weight: 500;
    letter-spacing: .03em; white-space: nowrap; color: #dce9cf;
  }
  #credit {
    position: fixed; bottom: calc(12px + var(--safe-bottom)); left: 50%;
    transform: translateX(-50%); z-index: 16;
    font-size: 11px; line-height: 1.4; letter-spacing: .05em; white-space: nowrap;
    color: #dce9cf; opacity: .72; text-decoration: none;
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
    transition: opacity .2s ease, color .2s ease;
  }
  #credit:hover, #credit:focus-visible { opacity: 1; color: #f1ffd7; text-decoration: underline; }
  #fallback {
    position: fixed; inset: 0; display: none; place-items: center; padding: 24px;
    background: #1a2416; color: #dce9cf; text-align: center; z-index: 20;
  }
  #fallback p { max-width: 40ch; }
  .quest-label { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #e8cd80; }
  #world-quests {
    position: fixed; right: 24px; top: clamp(100px, 22vh, 190px); z-index: 10; width: 260px;
    pointer-events: none; color: #e6dfcc; text-shadow: 0 1px 2px #090e09;
    isolation: isolate;
    transition: opacity .18s ease, transform .18s ease;
  }
  /* The big map is read across the whole screen, and the tracker stands over
     the right of it. It steps aside while the map is open, the way it already
     stands down for the field banner: both say the same thing as the map. */
  body.map-open #world-quests { opacity: 0; transform: translateX(18px); visibility: hidden; }
  #world-quests::before {
    content: ''; position: absolute; inset: 20px -10px -14px; z-index: -1; pointer-events: none;
    background: #11190fc9;
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 84%, transparent), linear-gradient(180deg, transparent, #000 7%);
    mask-composite: intersect;
  }
  #world-quests h2 {
    margin: 0; height: 37px; display: flex; align-items: center; padding-left: 40px;
    background: url('/assets/world-quest-header.png') center / 100% 100% no-repeat;
    font: 16px Georgia, serif; color: #f4d56e; font-weight: 400;
  }
  /* The heading is a button only where the tracker folds. Everywhere else it
     takes no taps, so it cannot steal one from the field behind it. */
  #quest-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    flex: 1; align-self: stretch; padding: 0 12px 0 0; margin: 0;
    background: none; border: 0; font: inherit; color: inherit; text-align: left;
    pointer-events: none; cursor: default; -webkit-tap-highlight-color: transparent;
  }
  #world-quests.collapsible #quest-toggle { pointer-events: auto; cursor: pointer; touch-action: manipulation; }
  #quest-chevron { display: none; font-size: 11px; color: #f4d56e; transition: transform .2s ease; }
  #world-quests.collapsible #quest-chevron { display: block; }
  #world-quests.collapsed #quest-chevron { transform: rotate(-90deg); }
  #world-quests.collapsed #world-quest-list { display: none; }
  #world-quests.collapsed::before { inset: 20px -10px -6px; }
  #world-quest-summary { margin: 6px 16px 5px 26px; font-size: 10px; letter-spacing: .03em; color: #c6bea0; }
  /* Folded, the tracker still has to say where you are and how far along. */
  #world-quest-here { color: #ecd16b; }
  #world-quest-here:not(:empty)::after { content: " · "; color: #c6bea0; }
  #world-quest-list { list-style: none; margin: 0; padding: 0 12px 12px; max-height: calc(100dvh - clamp(100px, 22vh, 190px) - 310px); overflow-y: auto; pointer-events: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #ab8a3e #11190f66; }
  .world-quest { display: flex; gap: 8px; padding: 9px 4px; border-left: 2px solid transparent; transition: background .4s; }
  .world-quest.active { background: #d8b7530d; }
  .world-quest-badge { flex: 0 0 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: #9b8b58; }
  .world-quest.active .world-quest-badge { background: #f4d56e; box-shadow: 0 0 6px #e8cd8055; }
  .world-quest-copy { flex: 1; min-width: 0; }
  .world-quest-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .world-quest-title { font: 14px/1.3 Georgia, serif; color: #ecd16b; }
  .world-quest-percent { font: 11px/1.3 ui-sans-serif, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #cec9b6; }
  .world-quest-status { display: none; font-size: 10px; line-height: 1; }
  .world-quest.completed .world-quest-status { display: block; }
  .world-quest.completed progress { display: none; }
  .world-quest progress { display: block; appearance: none; border: 0; width: 100%; height: 2px; background: #ffffff12; border-radius: 3px; overflow: hidden; }
  .world-quest progress::-webkit-progress-bar { background: #ffffff12; }
  .world-quest progress::-webkit-progress-value { background: linear-gradient(90deg, #867039, #e8cd80); transition: width .5s ease; }
  .world-quest progress::-moz-progress-bar { background: #e8cd80; }
  .world-quest.completed { animation: quest-complete 1.3s ease-out; }
  .world-quest.completed .world-quest-title, .world-quest.completed .world-quest-status { color: #c6efa0; }
  .world-quest.completed .world-quest-badge { color: #c6efa0; background: transparent; box-shadow: none; font: 12px/6px system-ui; }
  .world-quest.completed progress::-webkit-progress-value { background: linear-gradient(90deg, #53814a, #c6efa0); }
  .world-quest.completed progress::-moz-progress-bar { background: #c6efa0; }
  @keyframes quest-complete { 0%, 25% { background-color: #e2ef9366; filter: brightness(1.5); } 100% { background-color: transparent; filter: brightness(1); } }
  @media (max-width: 1100px) { #world-quests { width: 240px; right: 12px; top: 160px; } }
  @media (max-width: 700px), (max-height: 560px) and (max-width: 1000px) {
    #world-quests { top: calc(8px + var(--safe-top) + 124px); right: 8px; width: 202px; }
    #world-quests h2 { font-size: 13px; height: 32px; padding-left: 30px; }
    #world-quest-summary { font-size: 9px; margin: 4px 10px 4px 18px; }
    /* Leave the minimap its corner: the list scrolls rather than reach it. */
    #world-quest-list { padding: 0 6px 6px; max-height: min(300px, calc(100dvh - 322px)); }
    .world-quest { padding: 7px 3px; gap: 6px; }
    .world-quest-title { font-size: 13px; }
  }
  @media (max-height: 620px) and (min-width: 1001px) { #world-quests { top: 85px; } #world-quest-list { max-height: calc(100dvh - 340px); } .world-quest { padding-top: 3px; padding-bottom: 3px; } }
  @media (prefers-reduced-motion: reduce) { .world-quest, .world-quest.completed { animation: none; transition: none; } .world-quest progress::-webkit-progress-value { transition: none; } }
  #field-banner {
    position: fixed; top: calc(18px + clamp(30px, 5.2vw, 66px)); left: 50%; transform: translate(-50%, 8px);
    width: min(92vw, 700px); aspect-ratio: 3 / 1; container-type: inline-size;
    text-align: center; pointer-events: none; z-index: 11;
    opacity: 0; transition: opacity .6s ease, transform .6s ease;
    text-shadow: 0 2px 16px #172311, 0 1px 3px #172311;
  }
  #field-banner-art { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 6px 10px #14200e66); }
  #field-banner-copy {
    position: absolute; left: 17%; right: 17%; top: 40%; bottom: 32%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .6cqw;
  }
  #field-banner-label { font-size: 1.5cqw; line-height: 1.2; letter-spacing: .12em; white-space: nowrap; }
  #field-banner.visible { opacity: 1; transform: translate(-50%, 0); }
  #field-banner-name { margin: 0; font-family: Georgia, serif; font-weight: 700; line-height: 1.1; font-size: 4.5cqw; white-space: nowrap; color: #fff0be; }
  body:has(#field-banner.visible) #help { visibility: hidden; }
  #board {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 12; pointer-events: none;
    min-width: min(380px, 80vw); padding: 18px 22px 20px;
    background: rgba(20, 32, 14, .95); border: 1px solid rgba(232, 205, 128, .35);
    border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
    text-shadow: 0 1px 3px #14200e;
  }
  #board[hidden] { display: none; }
  #board .quest-label { display: block; margin-bottom: 12px; text-align: center; }
  #board-list {
    margin: 0; padding: 0; list-style: none;
    display: flex; flex-direction: column; gap: 2px;
    max-height: 46vh; overflow: hidden;
  }
  #board-list li {
    display: flex; justify-content: space-between; gap: 24px;
    padding: 5px 8px; border-radius: 5px;
    font-size: 14px; line-height: 1.35; color: #dce9cf;
    font-variant-numeric: tabular-nums;
  }
  #board-list li.mine { background: rgba(229, 255, 151, .14); color: #f1ffd7; font-weight: 700; }
  #board-list li span:last-child { color: #e8cd80; }

  /* ------------------------------------------------------------------ *
   * touch controls
   * A thumb gets one stick and two buttons, and nothing else on a phone
   * may sit where the thumbs land: the bottom left and the bottom right.
   * ------------------------------------------------------------------ */
  #touch-ui { display: none; }
  body.touch #touch-ui { display: block; }
  #stick-zone {
    position: fixed; left: 0; bottom: 0; z-index: 14;
    width: min(54vw, 320px); height: min(42dvh, 330px);
    touch-action: none;
  }
  #stick {
    position: absolute; left: 50%; bottom: calc(84px + var(--safe-bottom));
    transform: translate(-50%, 50%);
    width: 124px; height: 124px; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,.16), rgba(16,26,11,.55));
    border: 2px solid rgba(220,233,207,.4);
    box-shadow: 0 6px 22px rgba(11,18,8,.45), inset 0 1px 0 rgba(255,255,255,.18);
    opacity: .75; transition: opacity .25s ease, left .18s ease, bottom .18s ease;
  }
  #stick.grabbed { opacity: 1; transition: none; }
  #stick-knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 34%, #f4ffd9, #9db87c);
    border: 1.5px solid rgba(36,51,24,.42);
    box-shadow: 0 3px 12px rgba(11,18,8,.45);
    transition: transform .16s ease;
  }
  #stick.grabbed #stick-knob { transition: none; }
  #touch-actions {
    position: fixed; z-index: 14; right: 16px;
    bottom: calc(var(--map-top, 150px) + 12px);
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .touch-action-row { display: flex; align-items: center; gap: 8px; }
  .touch-btn {
    display: grid; place-items: center; padding: 0; margin: 0;
    width: 52px; height: 52px; border-radius: 50%;
    font: 25px/1 "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", ui-sans-serif, system-ui, sans-serif;
    color: #f1ffd7; background: rgba(20,32,14,.66);
    border: 1.5px solid rgba(220,233,207,.28);
    box-shadow: 0 4px 16px rgba(11,18,8,.4);
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .touch-btn:active { transform: scale(.94); }
  .touch-btn[aria-pressed="true"], .touch-btn[aria-expanded="true"] {
    background: rgba(53,79,37,.88); border-color: rgba(232,205,128,.55);
  }
  #emote-row { display: flex; gap: 8px; }
  #emote-row[hidden] { display: none; }
  /* The thumb reads the picture, not the button: the glyph takes the button. */
  #emote-row .touch-btn { width: 54px; height: 54px; font-size: 28px; animation: emote-pop .22s cubic-bezier(.2,1.5,.4,1) backwards; }
  #emote-row .touch-btn:nth-child(2) { animation-delay: .04s; }
  #emote-row .touch-btn:nth-child(3) { animation-delay: .08s; }
  #emote-row .touch-btn:nth-child(4) { animation-delay: .12s; }
  @keyframes emote-pop { from { transform: scale(.2); opacity: 0; } }
  body.touch #board { pointer-events: auto; }

  @media (max-width: 700px), (max-height: 560px) and (max-width: 1000px) {
    /* The title, the score and the hint stack at the top, so the whole
       bottom of the screen belongs to the thumbs and the mower. */
    #brand { top: calc(8px + var(--safe-top)); font-size: 22px; letter-spacing: -.02em; }
    #score {
      top: calc(43px + var(--safe-top)); bottom: auto;
      font-size: 26px;
    }
    #mower-count { margin-bottom: 2px; font-size: 10px; }
    #help {
      top: calc(85px + var(--safe-top)); font-size: 11px;
      max-width: 82vw; letter-spacing: .02em; line-height: 1.45;
    }
    #credit { bottom: calc(5px + var(--safe-bottom)); font-size: 10px; }
    /* The banner drops below the score rather than over it, and the tracker
       stands down while it shows: the two of them say the same thing. */
    #field-banner { top: calc(100px + var(--safe-top)); width: min(88vw, 420px); }
    body:has(#field-banner.visible) #world-quests { visibility: hidden; }
    #board { min-width: min(320px, 88vw); padding: 16px 16px 18px; }
    #board-list li { font-size: 13px; gap: 14px; }
  }
  @media (max-height: 560px) and (max-width: 1000px) {
    #stick-zone { height: min(64dvh, 260px); }
    #stick { width: 104px; height: 104px; bottom: calc(66px + var(--safe-bottom)); }
    #stick-knob { width: 48px; height: 48px; margin: -24px 0 0 -24px; }
    /* No room above the minimap on a screen this short: sit beside it. */
    #touch-actions { right: calc(var(--map-side, 220px) + 12px); bottom: calc(14px + var(--safe-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) {
    #field-banner { transition: none; }
    #field-meter::-webkit-progress-value { transition: none; }
    #stick, #stick-knob, .touch-btn { transition: none; }
    #emote-row .touch-btn { animation: none; }
  }
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<canvas id="hud"></canvas>
<h1 id="brand">keepmow.ing</h1>
<div id="score" aria-label="Score"><span id="mower-count">Connecting…</span><number-flow data-will-change></number-flow></div>
<div id="help">W A S D or arrow keys to drive · hold Space to emote · hold M for the map · hold Tab for the board · the blades are always down</div>
<aside id="world-quests" aria-label="World Quest Tracker">
  <h2><button id="quest-toggle" type="button" aria-expanded="true" aria-controls="world-quest-list">World Quest Tracker<span id="quest-chevron" aria-hidden="true">&#9662;</span></button></h2>
  <div id="world-quest-summary"><span id="world-quest-here"></span><span id="world-quest-done">0 / 6 completed</span></div>
  <ol id="world-quest-list"></ol>
</aside>
<div id="field-banner" role="status">
  <img id="field-banner-art" src="/assets/field-entry-banner.png" width="2172" height="724" alt="" />
  <div id="field-banner-copy"><div id="field-banner-label" class="quest-label"></div><div id="field-banner-name"></div></div>
</div>
<aside id="board" hidden aria-label="Mowers on the Lawn">
  <span class="quest-label">On the Lawn &middot; this visit</span>
  <ol id="board-list"></ol>
</aside>
<a id="credit" href="https://github.com/Onnokh" target="_blank" rel="noopener noreferrer">Made by Onkie</a>
<div id="touch-ui">
  <div id="stick-zone"><div id="stick"><div id="stick-knob"></div></div></div>
  <div id="touch-actions">
    <div class="touch-action-row">
      <div id="emote-row" hidden></div>
      <button id="emote-btn" class="touch-btn" type="button" aria-expanded="false" aria-label="Emote">&#128522;</button>
    </div>
    <button id="board-btn" class="touch-btn" type="button" aria-pressed="false" aria-label="Mowers on the Lawn">&#9776;</button>
  </div>
</div>
<div id="fallback"><p id="fallback-text"></p></div>

<script type="module">
import { landScore, updateScore } from '/score.js';
import { BALL_RADIUS, BALL_STEP, stepBall } from '/ball.js';
import { fieldAt, wetAt, dryStart, buildMapImage, MAP_WGSL, FIELD_NAMES, createFieldQuests } from '/fields.js';
const fieldQuests = createFieldQuests();
/* ------------------------------------------------------------------ *
 * The Lawn: one shared field, one Durable Object, many Mowers.
 * Blade Height is a pure function of the time since a Tile was cut, so
 * the grass keeps growing with nobody connected and nothing ticking.
 * ------------------------------------------------------------------ */

const gpuCanvas = document.getElementById("gpu");
const hud = document.getElementById("hud");
const g = hud.getContext("2d");
const minimapFrame = new Image();
minimapFrame.src = '/assets/minimap-frame.png';
const minimapOpening = new Image();
minimapOpening.src = '/assets/minimap-opening.png';
const minimapCanvas = document.createElement('canvas');
/** The notch inset. JS cannot ask env() for it, so it is read back from CSS. */
let safeBottom = 0;
function readSafeArea() {
  safeBottom = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--safe-bottom")) || 0;
}
readSafeArea();
addEventListener("resize", readSafeArea);
addEventListener("orientationchange", readSafeArea);
const help = document.getElementById("help");
const mowerCountEl = document.getElementById("mower-count");

function showMowerCount(count) {
  if (count === shownMowerCount) return;
  shownMowerCount = count;
  mowerCountEl.textContent = `${count} ${count === 1 ? 'mower' : 'mowers'} active`;
}
let shownMowerCount = -1;

const PATCH = 90;        // tiles of grass generated around the camera target
const CELL3 = 0.28;      // blade spacing in tiles
const SEGS = 4;          // segments along one blade
/**
 * A blade of grass is one or two pixels wide, which is exactly the geometry
 * that breaks up without multisampling: the blades come apart into speckles
 * that crawl as the Mower drives. Four samples is the count every WebGPU
 * adapter must support, and it costs about 1.3 ms a frame here — far less
 * than the density it replaces.
 */
const SAMPLES = 4;
const MOWER_SCALE = 2.6; // the deck should about match the cut width
/**
 * Mower models one frame can hold. The field carries them in the camera
 * uniform, so the count is fixed and the Lawn may hold more Mowers than this.
 * It is 24 because a Mower costs one pair of `vec4f` there, and because the
 * camera sees far less than 24 Mowers at once on any Lawn worth driving.
 */
const MOWER_SLOTS = 24;
/** Where the paint of the first Mower sits in the camera uniform, in floats. */
const MOWER_COL0 = 60 + MOWER_SLOTS * 4;
/** Floats in the camera uniform. Mirrors `struct Cam` in the shader. */
const BALL_OFFSET = MOWER_COL0 + MOWER_SLOTS * 4;
const CAM_FLOATS = BALL_OFFSET + 8;
const SHADOW_SIZE = 1536;
/** Texels per Tile and Tiles of margin in the ground bake. Mirrors the shader. */
const GROUND_RES = 4, GROUND_MARGIN = 12;
let bakeGround = false;
const PEER_TIMEOUT = 4000;
/**
 * How often a Mower reports itself to the Lawn, and how often it does so
 * while it stands still. Every report costs the Lawn, so a Mower that has
 * nothing new to say says it seldom. See "What a report costs" in CONTEXT.md.
 *
 * A Mower that stops and drives off again is drawn sliding out of the spot it
 * stood in, because the two reports it sits between are that far apart. Half
 * a second is short enough that it reads as a Mower pulling away.
 */
const SEND_MS = 100;
const STILL_SEND_MS = 500;
/**
 * A remote Mower is drawn where it really was this long ago, so there is
 * always a pair of real reports to sit between. Nothing is ever predicted
 * forward: a Mower turns too sharply for that to be anything but overshoot.
 *
 * Three reporting intervals. Two is the usual choice, but one lost report
 * then leaves a gap exactly as wide as the buffer, and the Mower stalls and
 * jumps. Three absorbs a lost report and measures far smoother; a fourth buys
 * almost nothing for another interval of delay.
 */
const INTERP_DELAY = SEND_MS * 3;
const COLLISION_RADIUS = MOWER_SCALE * 0.85;
/**
 * A Mower that is bumped is dazed this long: it takes no throttle and no
 * steering, and it wears a ring of Stars while it comes to its senses.
 */
const STUN_MS = 1000;
/** How much harder a dazed Mower is held back, on top of the usual drag. */
const STUN_DRAG = 3;
/** A contact that closes this fast throws up dust and shakes the camera. */
const BUMP_SPEED = 0.8;
/**
 * A contact that closes this fast takes the controls: about half of `MAX_V`.
 * A Mower that rolls into another is not a Mower that rams it, and only a ram
 * dazes. Closing speed is the speed the two really meet at, so a Mower that
 * is only caught up with is not dazed by the Mower behind it.
 */
const STUN_SPEED = 6;
/**
 * A Mower cannot be dazed again until this long after a daze ends. Without
 * it one Mower parks on another and rams it again the moment it comes round,
 * and the Mower under the wheels never drives again. A hostage therefore
 * costs the Lawn one second in four, and never the whole afternoon.
 */
const STUN_GRACE_MS = 3000;
let myId = "";
/** What this Mower is called and coloured by. It follows the Mower Key. */
let myName = "";
/** Your own paint. It comes from your id, so every screen agrees on it. */
let myHue = 80;

/** A Snapshot entry is how far a Tile is through its Regrowth, at this scale. */
const SNAPSHOT_SCALE = 65535;
let W = 408, H = 272, RADIUS = 2.6;
/** Milliseconds of Regrowth per Tile. The server says how to build it. */
let regrowMs = null;
/** Milliseconds a Tile stays mown before it grows. The server says how long. */
let cooldownMs = 0;
let mownAt = null;       // absolute ms per Tile
let mowDir = null;       // heading of the cut per Tile
let clockOffset = 0, connected = false, socket = null;
let strokes = 0, bladesCut = 0, mowerCount = 1;
let mowing = 0;
const clippings = [];
const settling = new Map();
/** The field as the GPU reads it: Blade Height in r, the cut heading as cos and sin in g and b. */
let fieldPx = null, fieldDirty = false, fieldBuiltAt = -Infinity;

function paintDir(i, a) {
  fieldPx[i * 4 + 1] = (Math.cos(a) * 0.5 + 0.5) * 255 + 0.5 | 0;
  fieldPx[i * 4 + 2] = (Math.sin(a) * 0.5 + 0.5) * 255 + 0.5 | 0;
}

function onGrass(x, y) {
  return fieldAt(x, y, W, H) >= 0;
}

function throwClippings(x, y, heading, amount) {
  mowing = Math.min(1, mowing + amount * 0.09);
  const born = performance.now();
  const count = Math.min(18, Math.ceil(amount * 4));
  for (let i = 0; i < count; i++) {
    const across = (Math.random() - 0.5) * 2.5;
    const angle = heading + Math.PI + (Math.random() - 0.5) * 0.9;
    const speed = 1.2 + Math.random() * 1.8;
    clippings.push({ x: x - Math.cos(heading) * 2.5 - Math.sin(heading) * across,
      y: y - Math.sin(heading) * 2.5 + Math.cos(heading) * across,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      up: 0.6 + Math.random() * 0.8, born, life: 320 + Math.random() * 220,
      spin: (Math.random() - 0.5) * 15, tint: Math.floor(Math.random() * 3) });
  }
  if (clippings.length > 160) clippings.splice(0, clippings.length - 160);
}

/** Other Mowers: id -> { x, y, a, buf, score, seen, hue }. */
const peers = new Map();

/** Your Mower. Tile units, a = heading in radians, v = tiles per second. */
let ball = null;
let ballVisual = null;
let ballReceivedAt = 0;
let ballFrameAt = 0;
function receiveBall(message) {
  if (![message.x, message.y, message.z, message.vx, message.vy, message.vz,
        message.rollX, message.rollY, message.n].every(Number.isFinite)) return;
  ball = { ...message };
  if (!ballVisual) ballVisual = { ...ball };
  ballReceivedAt = performance.now();
  ballFrameAt = ballReceivedAt;
  // Predict only a short distance; stale connections must not launch a ghost ball.
  const age = Math.min(0.1, Math.max(0, (Date.now() + clockOffset - message.n) / 1000));
  for (let left = age; left > 0; left -= BALL_STEP) {
    stepBall(ball, Math.min(BALL_STEP, left), W, H, (x, y) => wetAt(x, y, W, H));
  }
}
function animateBall(ts) {
  if (!ball) return;
  const dt = Math.min(0.05, Math.max(0, (ts - ballFrameAt) / 1000));
  ballFrameAt = ts;
  if (ts - ballReceivedAt < 200) {
    for (let left = dt; left > 0; left -= BALL_STEP) {
      stepBall(ball, Math.min(BALL_STEP, left), W, H, (x, y) => wetAt(x, y, W, H));
    }
  }
  const blend = 1 - Math.exp(-dt * 35);
  for (const key of ['x', 'y', 'z', 'rollX', 'rollY']) {
    ballVisual[key] += (ball[key] - ballVisual[key]) * blend;
  }
}

const me = { x: 204, y: 136, a: -Math.PI / 2, v: 0 };
const POSITION_KEY = "lawn:mower-position";
/**
 * The Mower Key says whose tally this is. The Lawn makes it, holds the score
 * under it and gives the score back; the browser only carries it between
 * visits. It is not the score, so there is nothing here to rewrite.
 */
const KEY_KEY = "lawn:mower-key";
function mowerKey() {
  try { return localStorage.getItem(KEY_KEY) ?? ""; } catch { return ""; }
}
function rememberKey(key) {
  if (typeof key !== "string" || !key) return;
  try { localStorage.setItem(KEY_KEY, key); } catch { /* The Lawn just gives a new Key next visit. */ }
}
let positionReady = false, positionSavedAt = 0, savedPosition = "";

function restorePosition() {
  if (positionReady) return;
  positionReady = true;
  const middle = dryStart(W, H, W / 2, H / 2, COLLISION_RADIUS);
  me.x = middle.x; me.y = middle.y;
  try {
    const p = JSON.parse(localStorage.getItem(POSITION_KEY));
    if (!p || ![p.x, p.y, p.a].every(Number.isFinite)) return;
    const x = Math.max(COLLISION_RADIUS, Math.min(W - COLLISION_RADIUS, p.x));
    const y = Math.max(COLLISION_RADIUS, Math.min(H - COLLISION_RADIUS, p.y));
    // The Lawn is not the Lawn it was last visit: a Mower whose last place is
    // now water is put down on the nearest dry ground instead of in a Ditch.
    const dry = dryStart(W, H, x, y, COLLISION_RADIUS);
    me.x = dry.x; me.y = dry.y;
    me.a = p.a;
    me.v = 0;
  } catch { /* Storage may be unavailable or contain an old invalid value. */ }
}

function savePosition() {
  if (!positionReady) return;
  const value = JSON.stringify({ x: me.x, y: me.y, a: me.a });
  if (value === savedPosition) return;
  try {
    localStorage.setItem(POSITION_KEY, value);
    savedPosition = value;
  } catch { /* Driving still works when storage is unavailable. */ }
}

addEventListener("pagehide", savePosition);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) savePosition();
});

const MAX_V = 13, ACCEL = 62, DRAG = 5.5, TURN = 3.0;
const keys = new Set();

function heightAt(i, now) {
  const age = now - mownAt[i];
  const regrow = regrowMs[i];
  if (age >= cooldownMs + regrow) return 1;
  // A Tile the client cannot date reads as mown, and so does a Tile still in
  // its Cooldown. Without this the answer is NaN, and one NaN in the score
  // stays there for the rest of the session.
  if (!(age > cooldownMs) || !(regrow > 0)) return 0;
  const t = (age - cooldownMs) / regrow;
  return 1 - (1 - t) * (1 - t);
}

/** One lattice point of the Growth Rate noise, 0 to 1. Mirrors the server. */
function vigourAt(x, y) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h ^= h >>> 13;
  return (h >>> 0) / 4294967296;
}

/**
 * Milliseconds of Regrowth for every Tile, from the bounds in the hello. The
 * Growth Rate is a pure function of the position of the Tile, so this table is
 * the one the server used to write the Snapshot. Mirrors the server exactly.
 */
function buildRegrow(min, max, patch) {
  const table = new Float32Array(W * H);
  const span = max - min;
  for (let y = 0; y < H; y++) {
    const gy = y / patch;
    const y0 = Math.floor(gy);
    const ty = gy - y0;
    const fy = ty * ty * (3 - 2 * ty);
    for (let x = 0; x < W; x++) {
      const gx = x / patch;
      const x0 = Math.floor(gx);
      const tx = gx - x0;
      const fx = tx * tx * (3 - 2 * tx);
      const a = vigourAt(x0, y0);
      const b = vigourAt(x0 + 1, y0);
      const c = vigourAt(x0, y0 + 1);
      const d = vigourAt(x0 + 1, y0 + 1);
      const top = a + (b - a) * fx;
      const bottom = c + (d - c) * fx;
      table[y * W + x] = min + (top + (bottom - top) * fy) * span;
    }
  }
  return table;
}

/** Cut the swath between two points. Mirrors the server exactly. */
function cut(x0, y0, x1, y1, heading, mine) {
  if (!mownAt) return;
  const now = Date.now() + clockOffset;
  const minX = Math.max(0, Math.floor(Math.min(x0, x1) - RADIUS));
  const maxX = Math.min(W - 1, Math.ceil(Math.max(x0, x1) + RADIUS));
  const minY = Math.max(0, Math.floor(Math.min(y0, y1) - RADIUS));
  const maxY = Math.min(H - 1, Math.ceil(Math.max(y0, y1) + RADIUS));
  const dx = x1 - x0, dy = y1 - y0, len2 = dx * dx + dy * dy;
  let harvested = 0;
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      const px = x + 0.5 - x0, py = y + 0.5 - y0;
      const t = len2 === 0 ? 0 : Math.min(1, Math.max(0, (px * dx + py * dy) / len2));
      const ox = px - t * dx, oy = py - t * dy;
      if (ox * ox + oy * oy > RADIUS * RADIUS) continue;
      const i = y * W + x;
      if (mine && onGrass(x + 0.5, y + 0.5)) {
        const height = heightAt(i, now);
        // Only grass that is really there counts, so the score can never take
        // a number that is not a number.
        if (height > 0) bladesCut += height;
        if (height > 0.1) harvested += height;
      }
      const standing = heightAt(i, now);
      if (standing > 0.08 && !settling.has(i)) {
        settling.set(i, { height: standing, born: performance.now(), duration: 170 + ((x * 17 + y * 31) % 60) });
      }
      mownAt[i] = now;
      mowDir[i] = heading;
      paintDir(i, heading);
    }
  }
  fieldDirty = true;
  if (mine && harvested > 0.1 && len2 > 0.0001) throwClippings(x1, y1, heading, harvested);
}

/* ---- the shared lawn ---- */

/**
 * One socket at a time. The browser fires "error" and then "close" for the
 * same drop, so a drop schedules one reconnect, not one per event. Events
 * from a socket that is no longer the current one are ignored: without this,
 * every drop doubled the sockets, one Mower counted as many, and drive()
 * sent on a socket that was still connecting.
 */
let retry = 500, reconnecting = false;
function connect() {
  reconnecting = false;
  const url = new URL("/lawn", location.href);
  url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";
  socket = ws;

  ws.addEventListener("open", () => {
    if (ws !== socket) { ws.close(); return; }
    retry = 500;
    // A fresh socket has said nothing yet, so the next report is news however
    // still the Mower is standing. The Lawn has to be told where this Mower
    // is before it can cut anything for it.
    sentX = sentY = sentA = null;
    // Say which Mower Key this browser holds, and say it in a message. A Key
    // in the address of the socket is written down by every machine between
    // here and the Lawn, and the Key is the whole of the proof of who a Mower
    // is. Nothing else is sent until the Lawn has answered, so no Mow Stroke
    // is ever counted under the wrong Mower.
    ws.send(JSON.stringify({ t: "i", k: mowerKey() }));
  });
  ws.addEventListener("message", (e) => {
    if (ws !== socket) return;
    if (e.data instanceof ArrayBuffer) {
      const ages = new Uint16Array(e.data);
      const now = Date.now() + clockOffset;
      settling.clear();
      mownAt = new Float64Array(ages.length);
      if (!mowDir || mowDir.length !== ages.length) mowDir = new Float32Array(ages.length);
      // A Snapshot entry spans the Cooldown and the Regrowth together, so the
      // moment it dates a Tile to is that far back along the whole cycle.
      for (let i = 0; i < ages.length; i++) mownAt[i] = now - (ages[i] / SNAPSHOT_SCALE) * (cooldownMs + regrowMs[i]);
      fieldPx = new Uint8Array(ages.length * 4);
      for (let i = 0; i < ages.length; i++) paintDir(i, mowDir[i]);
      fieldDirty = true;
      return;
    }
    const m = JSON.parse(e.data);
    if (m.t === "you") {
      // The Lawn has said which Mower this is, and what it has cut. The Lawn
      // counted these blades — this visit and every visit before it, under one
      // Mower Key — so there is no second tally for the board to show.
      myId = m.id;
      // The name and the colour come from the Mower Key, so they are the same
      // on every visit. The id is still one per socket, so two tabs of one
      // browser stay two Mowers.
      myName = m.nm || m.id;
      myHue = hueOf(myName);
      rememberKey(m.key);
      bladesCut = Number.isFinite(m.s) && m.s >= 0 ? m.s : 0;
      landScore(bladesCut);
      connected = true;
      return;
    }
    if (m.t === "hello") {
      W = m.w; H = m.h; RADIUS = m.radius;
      regrowMs = buildRegrow(m.regrowMin * 1000, m.regrowMax * 1000, m.patch);
      cooldownMs = m.cooldown * 1000;
      fieldQuests.resize(W, H);
      // Paint the map now, while the Lawn is still arriving. It is the same
      // walk over every Tile the quests just made, and doing it here keeps it
      // out of the first frame the Mower asks for the map.
      mapImage();
      restorePosition();
      clockOffset = m.now - Date.now();
      strokes = m.strokes;
    } else if (m.t === "ball") {
      receiveBall(m);
    } else if (m.t === "mow") {
      cut(m.x0, m.y0, m.x1, m.y1, Math.atan2(m.y1 - m.y0, m.x1 - m.x0), false);
      strokes = m.strokes;
    } else if (m.t === "peer") {
      const seed = m.nm || m.id;
      const p = peers.get(m.id) ?? { x: m.x, y: m.y, a: m.a, hue: hueOf(seed), buf: [] };
      p.name = nameOf(seed);
      p.hue = hueOf(seed);
      p.score = Number.isFinite(m.s) ? m.s : 0;
      p.seen = performance.now();
      // Keep the report on the shared clock, the same one the Tiles use.
      const at = Number.isFinite(m.n) ? m.n : Date.now() + clockOffset;
      const newest = p.buf[p.buf.length - 1];
      if (!newest || at > newest.t) p.buf.push({ t: at, x: m.x, y: m.y, a: m.a });
      peers.set(m.id, p);
    } else if (m.t === "score") {
      // The client counts along so the digits roll without waiting, and the
      // Lawn says here what it really cut. The Lawn wins: a swath it refused
      // was never grass this Mower took.
      if (Number.isFinite(m.s) && m.s >= 0) bladesCut = m.s;
    } else if (m.t === "bumped") {
      // The Stars of another Mower are its own word, exactly like its
      // position. A Mower that is not in the bump therefore sees it too.
      const p = peers.get(m.id);
      if (p) p.stunUntil = performance.now() + STUN_MS;
    } else if (m.t === "emoted") {
      const p = peers.get(m.id);
      if (p) { p.emote = m.e; p.emoteAt = performance.now(); }
    } else if (m.t === "gone") {
      peers.delete(m.id);
    }
    // The Lawn also says how many sockets it holds, in the hello and in a
    // `mowers` message. That number counts sockets, and a socket that died
    // without saying so is still one, so the heading counts Mowers that have
    // spoken instead. See "Who is on the Lawn" in CONTEXT.md.
  });
  const dropped = () => {
    if (ws !== socket || reconnecting) return;
    connected = false;
    reconnecting = true;
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 15000);
  };
  ws.addEventListener("close", dropped);
  ws.addEventListener("error", dropped);
}
/** Send a message to the Lawn. A socket that is not open drops it. */
function send(msg) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(msg));
}
function hueOf(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360;
  return h;
}

/**
 * A Mower's name comes from its id, so every screen reads the same name for
 * the same Mower and no name has to travel or be trusted.
 */
const NAME_FIRST = ["Brisk", "Quiet", "Dusty", "Merry", "Sleepy", "Bold", "Gentle", "Keen",
  "Sunny", "Rusty", "Nimble", "Stout", "Plucky", "Tidy", "Wily", "Humble"];
const NAME_LAST = ["Clover", "Bramble", "Thistle", "Daisy", "Fescue", "Sorrel", "Nettle", "Vetch",
  "Ryegrass", "Meadow", "Hedgerow", "Furrow", "Acorn", "Willow", "Bracken", "Yarrow"];

function nameOf(id) {
  let h = 2166136261;
  for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
  h >>>= 0;
  return `${NAME_FIRST[h % NAME_FIRST.length]} ${NAME_LAST[(h >>> 9) % NAME_LAST.length]}`;
}
connect();

/* ---- driving ---- */

/**
 * An Emote is presence, like a position: the server relays it and stores
 * nothing, so it fades from every screen on its own. Hold Space to open the
 * picker, steer left or right to choose, release to show it.
 */
const EMOTES = ["\u{1F44B}", "\u{1F44D}", "\u{1F604}", "\u{2764}\u{FE0F}"];
const EMOTE_MS = 2600;
let pickerOpen = false, pickerPick = 0, pickerAt = 0;
let myEmote = -1, myEmoteAt = 0;

function sendEmote(i) {
  myEmote = i;
  myEmoteAt = performance.now();
  if (connected) send({ t: "emote", e: i });
}

/**
 * Hold M to open the big map. It is held, like the board, so a hand that
 * leaves the keys always leaves the Lawn in view. The map grows into place
 * over the Lawn rather than replace it in one frame: `mapAt` is when it last
 * changed its mind, and every frame reads the shift from the clock.
 */
const MAP_MS = 190;
let mapOpen = false, mapAt = -MAP_MS;

/** How far out the big map is, from 0 (away) to 1 (open). */
function mapShift() {
  if (reducedMotion.matches) return mapOpen ? 1 : 0;
  const t = Math.min(1, (performance.now() - mapAt) / MAP_MS);
  const eased = t * t * (3 - 2 * t);
  return mapOpen ? eased : 1 - eased;
}

function showMap(open) {
  if (open === mapOpen) return;
  // A map sent back half open goes back from where it stands, not from the end.
  const from = mapShift();
  mapOpen = open;
  mapAt = performance.now() - MAP_MS * (open ? from : 1 - from);
  document.body.classList.toggle("map-open", open);
}

addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  keys.add(k);
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "tab"].includes(k)) e.preventDefault();
  if (e.repeat) return;
  if (k === "tab") openBoard();
  else if (k === "m") showMap(true);
  else if (k === " ") { pickerOpen = true; pickerAt = performance.now(); }
  else if (pickerOpen && (k === "a" || k === "arrowleft")) pickerPick = (pickerPick + EMOTES.length - 1) % EMOTES.length;
  else if (pickerOpen && (k === "d" || k === "arrowright")) pickerPick = (pickerPick + 1) % EMOTES.length;
  else if (k.length === 1 && k >= "1" && k <= String(EMOTES.length)) sendEmote(Number(k) - 1);
});
addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  keys.delete(k);
  if (k === " " && pickerOpen) { pickerOpen = false; sendEmote(pickerPick); }
  if (k === "m") showMap(false);
  if (k === "tab") closeBoard();
});
addEventListener("blur", () => {
  keys.clear(); pickerOpen = false; showMap(false); stick.mag = 0; closeBoard(); showEmoteRow(false);
});
const held = (...k) => k.some((x) => keys.has(x));

/**
 * The board: who is mowing now and how much each has cut on this visit. It is
 * built from presence alone, so a Mower that goes quiet drops off it by
 * itself. Every score on it is counted by the Lawn, so the board is the one
 * number on the screen a rewritten client cannot make up.
 */
const board = document.getElementById("board");
const boardList = document.getElementById("board-list");
const boardBtn = document.getElementById("board-btn");
let boardOpen = false, boardAt = 0;

function refreshBoard() {
  const now = performance.now();
  const rows = [];
  for (const [id, p] of peers) {
    if (now - p.seen <= PEER_TIMEOUT) rows.push({ name: p.name ?? nameOf(id), score: p.score ?? 0, mine: false });
  }
  rows.push({ name: myName ? nameOf(myName) : "You", score: Math.round(bladesCut), mine: true });
  rows.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  boardList.replaceChildren(...rows.map((r) => {
    const li = document.createElement("li");
    if (r.mine) li.className = "mine";
    const name = document.createElement("span");
    name.textContent = r.name;
    const score = document.createElement("span");
    score.textContent = r.score.toLocaleString();
    li.append(name, score);
    return li;
  }));
}

function openBoard() {
  boardOpen = true;
  boardAt = performance.now();
  refreshBoard();
  board.hidden = false;
  boardBtn.setAttribute("aria-pressed", "true");
}

function closeBoard() {
  if (!boardOpen) return;
  boardOpen = false;
  board.hidden = true;
  boardBtn.setAttribute("aria-pressed", "false");
}

/* ------------------------------------------------------------------ *
 * the stick
 *
 * The camera holds one heading, so the stick can mean a direction in the
 * world rather than a wheel: push where the Mower should go and it steers
 * there as fast as it can turn. Wheel controls under a thumb read as
 * inverted whenever the Mower faces the bottom of the screen, which is
 * half of the time. The physics are the ones the keys drive; only the
 * throttle and the steering come from somewhere else.
 * ------------------------------------------------------------------ */
const STICK_TRAVEL = 44, STICK_DEAD = 6;
const stick = { dx: 0, dy: 0, mag: 0 };
const stickZone = document.getElementById("stick-zone");
const stickEl = document.getElementById("stick");
const stickKnob = document.getElementById("stick-knob");
let stickPointer = -1, stickCx = 0, stickCy = 0;

function aimStick(clientX, clientY) {
  const dx = clientX - stickCx, dy = clientY - stickCy;
  const len = Math.hypot(dx, dy);
  const reach = Math.min(len, STICK_TRAVEL);
  stickKnob.style.transform = len > 0.001
    ? `translate(${dx / len * reach}px, ${dy / len * reach}px)` : "";
  if (len <= STICK_DEAD) { stick.mag = 0; return; }
  stick.dx = dx / len; stick.dy = dy / len;
  stick.mag = Math.min(1, (len - STICK_DEAD) / (STICK_TRAVEL - STICK_DEAD));
}

stickZone.addEventListener("pointerdown", (e) => {
  if (stickPointer !== -1) return;
  stickPointer = e.pointerId;
  stickZone.setPointerCapture(e.pointerId);
  // The base comes to the thumb. A stick you have to find first is a stick
  // you drive off the edge of.
  const zone = stickZone.getBoundingClientRect();
  stickEl.style.left = `${e.clientX - zone.left}px`;
  stickEl.style.bottom = `${zone.bottom - e.clientY}px`;
  stickEl.classList.add("grabbed");
  stickCx = e.clientX; stickCy = e.clientY;
